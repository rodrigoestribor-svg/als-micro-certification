<!DOCTYPE html>
<html lang="en" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ALS Life Skills 360° Micro-Certification</title>
<style>
:root{
  --maroon:#7a1f2b;
  --maroon-dark:#5c1620;
  --navy:#1b2a5e;
  --gold:#c8972a;
  --green:#2f6d4f;
  --paper:#faf7f0;
  --paper-line:#e7e0d0;
  --ink:#2a2420;
  --ink-soft:#5c554c;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
/* Long URLs (the Web App address) must never push the layout sideways. */
input,textarea,select,button{max-width:100%;}
.codebox,.linkbox input{overflow-wrap:anywhere;}
body{
  font-family:var(--sans);
  background:#ffffff;
  color:var(--ink);
  min-height:100vh;
}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

/* Letterhead */
.letterhead{
  display:flex;align-items:center;justify-content:center;gap:20px;
  padding:16px 18px;background:var(--navy);color:#fff;border-radius:10px;
  margin-bottom:26px;flex-wrap:wrap;text-align:center;
}
.letterhead .brandmark{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;}
.letterhead .brand-logos{display:flex;align-items:center;gap:14px;flex:none;}
.letterhead .brand-logos img{
  width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;padding:4px;flex:none;
}
.letterhead h1{font-family:var(--serif);font-size:1.15rem;margin:0;letter-spacing:.3px;}
.letterhead p{margin:0;font-size:.72rem;opacity:.8;letter-spacing:.4px;text-transform:uppercase;}
.letterhead .agencies{font-size:.68rem;opacity:.75;text-align:right;line-height:1.5;}

/* Cards */
.card{
  background:#fff;border:1px solid var(--paper-line);border-radius:12px;
  padding:26px 28px;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.card h2{font-family:var(--serif);font-size:1.35rem;margin:0 0 6px;color:var(--maroon-dark);}
.card .sub{color:var(--ink-soft);font-size:.92rem;margin:0 0 18px;line-height:1.5;}
label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
input[type=text],input[type=email],input[type=date],textarea,select{
  width:100%;padding:10px 12px;border:1px solid #d8d2c4;border-radius:8px;
  font-size:.95rem;font-family:var(--sans);background:#fdfcf9;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;
  border:none;font-size:.92rem;font-weight:600;cursor:pointer;font-family:var(--sans);
  transition:transform .06s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--maroon);color:#fff;}
.btn-primary:hover{background:var(--maroon-dark);}
.btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
.btn-outline:hover{background:#f0f2f8;}
.btn-gold{background:var(--gold);color:#3a2a05;}
.btn-gold:hover{filter:brightness(.95);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row>*{flex:1;min-width:220px;}

/* Rater status list */
.rater-list{list-style:none;margin:0;padding:0;}
.rater-list li{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border:1px solid var(--paper-line);border-radius:9px;margin-bottom:10px;
  background:var(--paper);flex-wrap:wrap;
}
.rater-list .who{display:flex;align-items:center;gap:10px;}
.dot{width:11px;height:11px;border-radius:50%;flex:none;}
.dot.pending{background:#d8b04a;}
.dot.done{background:var(--green);}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.linkbox{display:flex;gap:8px;align-items:center;}
.linkbox input{width:230px;font-size:.75rem;padding:7px 9px;background:#fff;}

/* Survey */
.skill-block{border-top:3px solid var(--maroon);padding-top:16px;margin-top:26px;}
.skill-block h3{font-family:var(--serif);color:var(--maroon-dark);margin:0 0 4px;font-size:1.15rem;}
.skill-block .desc{color:var(--ink-soft);font-size:.85rem;margin:0 0 14px;}
.opt{
  display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid #e7e0d0;
  border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff;flex-wrap:wrap;
}
.opt:hover{border-color:var(--gold);}
.opt input{margin-top:3px;flex:none;}
.opt .lvl{
  font-weight:700;color:var(--navy);font-size:.85rem;white-space:normal;
  flex:0 0 130px;width:130px;line-height:1.3;
}
.opt .txt{font-size:.87rem;line-height:1.45;color:var(--ink);flex:1 1 260px;min-width:0;}
.opt.selected{background:#fff8e8;border-color:var(--gold);}

/* Self-rating: statements only, no level labels/scores shown to the learner */
.opt.no-levels .lvl{display:none;}
.opt.no-levels .txt{flex-basis:100%;}
.soft-section-label{font-family:var(--serif);font-weight:700;color:var(--maroon-dark);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 6px;}
.soft-item{margin:14px 0;padding-top:10px;border-top:1px dashed var(--line, #e3d9c6);}
.soft-item:first-of-type{border-top:none;padding-top:0;}
.soft-item-title{font-weight:600;color:var(--ink);margin:0 0 2px;}
.soft-item-title .num{color:var(--maroon-dark);margin-right:6px;}
.soft-item-prompt{color:var(--ink-soft);font-size:.85rem;margin:0 0 8px;}
.soft-progress{font-size:.8rem;color:var(--ink-soft);margin:2px 0 0;}

/* One-skill-at-a-time survey */
.skill-step{display:none;}
.skill-step.active{display:block;}
.step-progress{margin:6px 0 4px;}
.step-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.step-head .now{font-family:var(--serif);font-weight:700;color:var(--maroon-dark);font-size:1rem;}
.step-head .count{font-size:.78rem;color:var(--ink-soft);}
.step-bar{height:7px;background:#ece5d5;border-radius:99px;overflow:hidden;margin-bottom:10px;}
.step-bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s ease;}
.step-pills{display:flex;gap:6px;flex-wrap:wrap;}
.step-pill{
  font-size:.72rem;padding:5px 10px;border-radius:99px;border:1px solid var(--paper-line);
  background:var(--paper);color:var(--ink-soft);font-family:var(--sans);cursor:default;
}
.step-pill.current{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600;}
.step-pill.done{background:#eaf6ee;border-color:#b9dcc6;color:var(--green);cursor:pointer;}
.soft-item.needs-answer{background:#fff1ee;border-radius:8px;outline:2px solid #d9573f;outline-offset:4px;animation:needsAnswerPulse 1.4s ease-out 2;}
@keyframes needsAnswerPulse{0%{outline-color:#d9573f;}50%{outline-color:#f7b9a8;}100%{outline-color:#d9573f;}}
.warn-modal h3{color:#b3401f;}
.warn-modal h3 .warn-ico{display:inline-block;margin-right:8px;}
.warn-modal .sum-list{margin-top:2px;}
.warn-modal .sum-list li{border-color:#f0c7ab;background:#fff6ee;}
.warn-modal .sum-check{background:#d9573f;}
.skill-step .skill-block-note{font-size:.8rem;color:var(--ink-soft);margin:0 0 6px;}

/* Review-before-submit popup (Life Skills only, no ratings) */
.sum-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(20,16,12,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
}
.sum-modal{
  background:#fff;border-radius:14px;max-width:520px;width:100%;padding:24px 24px 8px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow-y:auto;
}
.sum-modal h3{font-family:var(--serif);color:var(--maroon-dark);margin:0 0 6px;font-size:1.25rem;}
.sum-modal .sub{margin:0 0 14px;}
.sum-list{list-style:none;margin:0 0 6px;padding:0;}
.sum-list li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;
  border:1px solid #b9dcc6;background:#f3faf6;border-radius:9px;flex-wrap:wrap;
}
.sum-check{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;
}
.sum-name{font-weight:600;color:var(--ink);flex:1 1 160px;min-width:0;}
.sum-meta{font-size:.74rem;color:var(--ink-soft);}
.sum-edit{
  background:none;border:none;color:var(--navy);font-size:.78rem;font-weight:600;
  text-decoration:underline;cursor:pointer;padding:6px 2px;font-family:var(--sans);
}

/* Code box */
.codebox{
  background:#101425;color:#d8e0ff;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.72rem;padding:14px;border-radius:8px;word-break:break-all;max-height:120px;overflow:auto;
}
.notice{
  background:#fff4e0;border:1px solid #ecd08f;color:#5c4413;padding:12px 14px;border-radius:8px;
  font-size:.85rem;line-height:1.5;margin-bottom:16px;
}
.notice.ok{background:#eaf6ee;border-color:#a9d8b8;color:#1f4a30;}
.notice.err{background:#fdeaea;border-color:#e6b3b3;color:#7a1f1f;}

/* ══════════════════════════════════════════════════════════════════════
   THE CERTIFICATE — FIXED A4 CANVAS
   Both pages are built at exact millimetre dimensions and every size inside
   them is in mm or pt (physical units), never px, rem or %. That is what
   makes the print an exact copy of the preview: nothing re-flows between
   screen and paper, on any browser, printer or PDF viewer.

   277 x 190mm is the printable area of A4 landscape inside a 10mm margin,
   which is comfortably within the unprintable edge of every desk printer.

   On screen the page is shown through .sheet-scaler, which applies a CSS
   transform. A transform shrinks the picture without re-laying anything out,
   so a narrow window shows a smaller certificate — never a different one.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* A4 landscape is 297 x 210mm. With 10mm page margins the printable box is
     277 x 190mm; the sheet is kept 1mm inside it on each axis so rounding in
     any browser/printer can never push it onto a blank extra page. */
  --sheet-w: 276mm;
  --sheet-h: 189mm;
}

.sheet-stage{width:100%;display:flex;justify-content:center;margin-bottom:8mm;}
.sheet-scaler{transform-origin:top center;}

.certificate,.backpage{
  width:var(--sheet-w); height:var(--sheet-h);
  min-width:var(--sheet-w); min-height:var(--sheet-h);
  max-width:var(--sheet-w); max-height:var(--sheet-h);
  box-sizing:border-box;
  background:#ffffff;
  border:2mm double var(--gold);
  position:relative;
  display:flex; flex-direction:column;
  overflow:hidden;
  font-family:var(--sans);
  color:var(--ink);
  /* Print the gold border, navy table header and paper tint even when the
     user forgets the browser's "Background graphics" checkbox. */
  -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
}
.certificate{padding:6mm 14mm;}
.backpage{padding:7mm 12mm;}
.certificate{box-shadow:0 6mm 14mm -6mm rgba(40,25,10,.35);}
.backpage{box-shadow:0 6mm 14mm -6mm rgba(40,25,10,.35);}

/* ---- Tiled watermark, sitting behind everything on the front page ---- */
.certificate .watermark{
  position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
}
.certificate .watermark .wm-rot{
  position:absolute; top:-35%; left:-35%; width:170%; height:170%;
  transform:rotate(-30deg);
  display:flex; flex-direction:column; justify-content:space-between;
}
.certificate .watermark .wm-row{
  display:flex; justify-content:space-between; white-space:nowrap;
}
.certificate .watermark span{
  font-family:var(--serif); font-size:9pt; letter-spacing:.6pt;
  text-transform:uppercase; color:var(--maroon);
  opacity:.06;
}
.certificate > *:not(.watermark){position:relative; z-index:1;}

/* ---- Corner tag ---- */
.certificate .microtag{
  position:absolute; top:4mm; right:7mm; z-index:2;
  font-size:6pt; letter-spacing:.9pt; text-transform:uppercase;
  color:#c9b27c; font-weight:700;
}

/* ---- Masthead: the DepEd logo, upper middle ---- */
.certificate .top-logo{
  display:flex; align-items:flex-end; justify-content:center;
  height:24mm; margin-bottom:1mm; line-height:0;
}
.certificate .top-logo img{height:24mm; width:auto; object-fit:contain; display:block;}

/* ---- Headings and the recipient ---- */
.certificate h2{
  text-align:center; font-family:var(--serif); font-size:20pt; line-height:1.08;
  color:var(--maroon-dark); margin:0 0 2mm; letter-spacing:.5pt;
}
.certificate .lead{
  text-align:center; color:var(--ink-soft); font-size:10pt; line-height:1.25;
  margin:0 auto 1mm; max-width:170mm;
}
.certificate .learner-name{
  text-align:center; font-family:var(--serif); font-style:italic;
  font-size:25pt; line-height:1.1; color:var(--navy);
  margin:1mm 0 1.5mm; padding-bottom:1mm;
  border-bottom:.6mm solid var(--gold); display:block;
}
/* Long names step down in size rather than pushing the page out of shape.
   Chosen from the name's length, so the preview and the print always agree. */
.certificate .learner-name.len-2{font-size:23pt;}
.certificate .learner-name.len-3{font-size:19pt;}
.certificate .lead2{
  text-align:center; color:var(--ink-soft); font-size:9.5pt; line-height:1.45;
  max-width:244mm; margin:0 auto 2.5mm;
}
.certificate .cert-body{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}

/* ---- Skills table ---- */
table.skills-table{width:100%; border-collapse:collapse; margin:0 0 2mm; table-layout:fixed;}
.certificate .cert-body > h2{flex:none;}
table.skills-table th,table.skills-table td{
  border:.25mm solid var(--paper-line); padding:1.1mm 2.5mm; text-align:left;
  font-size:12.5pt; line-height:1.2; vertical-align:middle;
}
table.skills-table th{
  background:var(--navy); color:#fff; font-weight:600;
  font-size:10pt; text-transform:uppercase; letter-spacing:.2pt; padding:1.2mm 2.5mm; white-space:nowrap;
}
table.skills-table col.c1{width:40%;}
table.skills-table col.c2{width:25%;}
table.skills-table col.c3{width:35%;}
/* equal-height body rows: the table is stretched to fill the page, so the
   spare height is shared evenly between the four skills */
.main-left table.skills-table tbody tr{height:20%;}
table.skills-table td.level{font-weight:700; color:var(--maroon-dark); white-space:nowrap;}
table.skills-table tr:nth-child(even) td{background:#ffffff;}
.certificate .foot-star{font-size:7.5pt; line-height:1.3; color:var(--ink-soft); margin:0 0 2mm;}

/* ---- Footer: logos bottom-left, details, signature, QR ---- */
.cert-bottom{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  column-gap:6mm;
  align-items:end;
  margin-top:auto; flex:none;
}
.cert-logos{
  grid-column:1; grid-row:1; align-self:end; justify-self:start;
  display:flex; align-items:flex-end; gap:5mm; line-height:0;
}
.cert-logos img{height:26mm; width:auto; max-width:38mm; object-fit:contain; display:block;}
.cert-logos .logo-slot.partner:not(.has-img){display:none;}
@media screen{ .cert-logos .logo-slot.partner:not(.has-img){display:flex;} }
.cert-logos .logo-slot{display:flex; align-items:flex-end;}
.cert-logos .logo-ph{
  width:26mm; height:26mm; border:.4mm dashed #c8b98a; border-radius:1.5mm;
  display:flex; align-items:center; justify-content:center;
  font-size:6.5pt; line-height:1.25; color:#b6a778; text-align:center;
  padding:1mm; cursor:pointer;
}
/* Date issued / cert number now sit in the right-hand corner, beside the QR */
.cert-meta{width:100%; text-align:center; margin:0 0 1.5mm;}
.cert-meta p{margin:0 0 .4mm; font-size:6.8pt; line-height:1.22; color:var(--ink-soft); overflow-wrap:anywhere;}
.cert-meta b{color:var(--ink);}
/* Signature spans the full width of the certificate so it sits dead-center */
.sig-block{grid-column:2; grid-row:1; justify-self:center; align-self:end; text-align:center; width:72mm; max-width:100%; min-width:0;}
.sig-line{
  border-top:.3mm solid var(--ink); margin-bottom:1mm; padding-top:1.5mm;
  font-size:10.5pt; font-family:var(--serif); min-height:5mm;
}
.sig-line,.sig-role{overflow-wrap:anywhere;}
.sig-role{font-size:8pt; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5pt;}

/* ---- Optional passport-size photo, beside the QR near the right border ---- */
/* Main area: left = table + footer (logos, signature); right = photo on top,
   QR details + QR at the bottom. The table stretches to fill the height that
   is left, so no part of the page is dull or wasted, and the photo's top edge
   sits exactly level with the top of the table. */
.cert-main{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:minmax(0,1fr) 60mm; column-gap:6mm; align-items:stretch;
}
.main-left{display:flex; flex-direction:column; min-width:0; min-height:0;}
.main-left table.skills-table{flex:1 1 auto; margin:0 0 2mm; height:auto;}
.main-right{
  display:flex; flex-direction:column; justify-content:space-between; align-items:center; gap:2mm;
  min-width:0; min-height:0;
}
.photo-slot{
  flex:none; align-self:center;
  display:flex; flex-direction:column; align-items:center; gap:1mm;
}
label.photo-box{margin:0;}
.photo-box{
  width:35mm; height:45mm; border:.3mm dashed #b6a778; box-sizing:border-box;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:#fff; cursor:pointer; position:relative;
}
.photo-box img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-box .photo-hint{
  font-size:6pt; line-height:1.3; color:#8c7f55; text-align:center; padding:1.5mm;
}
.photo-box.has-img{border:.3mm solid #c8b98a;}
.photo-box.has-img .photo-hint{display:none;}
.photo-name{
  font-size:7.5pt; font-weight:700; line-height:1.15; color:var(--ink);
  text-align:center; max-width:35mm; overflow-wrap:anywhere;
}
/* Photo is OPTIONAL. With no photo the right-hand column narrows (so the
   skills table and footer take the space) and the empty photo frame is never
   printed. On screen the dashed frame stays visible so a photo can be added. */
.cert-main.no-photo{grid-template-columns:minmax(0,1fr) 50mm; column-gap:5mm;}
.cert-main.no-photo .main-right{justify-content:flex-end;}
.cert-main.no-photo .qr-slot img{width:30mm; height:30mm;}
.cert-main.no-photo .qr-slot .qr-caption{max-width:34mm;}
.photo-remove{
  background:none;border:none;color:#7a1f2b;font-size:.7rem;text-decoration:underline;
  cursor:pointer;padding:0;font-family:var(--sans);
}
@media print{
  .photo-slot:not(.has-photo){display:none !important;}
}
.qr-slot{
  flex:none; align-self:stretch; width:100%;
  display:flex; flex-direction:column; align-items:center; gap:0;
}
.qr-slot img{margin-bottom:1mm;}
.qr-slot img{width:25mm; height:25mm; object-fit:contain; background:#fff; image-rendering:crisp-edges;}
.qr-slot .qr-caption{font-size:7pt; line-height:1.2; color:var(--ink-soft); text-align:center; max-width:28mm;}

[contenteditable="true"]{outline-offset:2px;}
[contenteditable="true"]:hover{outline:.3mm dashed var(--gold);}
[contenteditable="true"]:focus{outline:.3mm solid var(--maroon);}

/* ---- Back page: the proficiency reference guide ---- */
.backpage h3{
  text-align:center; font-family:var(--serif); color:var(--maroon-dark);
  margin:0 0 2mm; font-size:14pt; line-height:1.15;
}
.backpage .back-intro{
  text-align:center; font-size:9.5pt; line-height:1.35; color:var(--ink-soft);
  margin:0 0 3.5mm;
}
.legend-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:3.5mm 9mm;
  flex:1 1 auto; min-height:0; align-content:space-between;
}
.legend-col h4{
  font-size:10.5pt; color:var(--navy); margin:0 0 1.5mm;
  border-bottom:.25mm solid var(--paper-line); padding-bottom:1.2mm;
}
.legend-col .lvl-row{
  font-size:8.5pt; line-height:1.36; margin:0 0 1.4mm; color:var(--ink-soft);
}
.legend-col .lvl-row b{color:var(--ink);}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}
.smallnote{font-size:.75rem;color:var(--ink-soft);margin-top:8px;}
nav.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
nav.tabs .tabbtn{
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--paper-line);padding:10px 16px;border-radius:22px;
  font-size:.85rem;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);
  text-decoration:none;min-height:44px;             /* comfortable tap target */
  -webkit-tap-highlight-color:rgba(122,31,43,.15);
}
nav.tabs .tabbtn.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
footer.site{text-align:center;color:var(--ink-soft);font-size:.72rem;margin-top:40px;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:4px 0 20px;}
.stat{background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;padding:14px 16px;}
.stat .n{font-family:var(--serif);font-size:1.7rem;color:var(--maroon-dark);line-height:1.1;}

.table-scroll{overflow-x:auto;border:1px solid var(--paper-line);border-radius:10px;}
table.dash{width:100%;border-collapse:collapse;font-size:.8rem;min-width:900px;}
table.dash th{background:var(--navy);color:#fff;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;
  padding:9px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;}
table.dash td{padding:8px 10px;border-top:1px solid var(--paper-line);vertical-align:top;}
table.dash tr:nth-child(even) td{background:#faf7ef;}
table.dash tr:hover td{background:#fff8e8;}
table.dash td.num{text-align:center;font-weight:700;color:var(--maroon-dark);}
.pill{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 8px;border-radius:11px;white-space:nowrap;}
.pill.ok{background:#e4f2e9;color:#1f4a30;}
.pill.wait{background:#fdf1d8;color:#6b5010;}
.pill.issued{background:#e6ebfa;color:#1b2a5e;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.filters > div{flex:1;min-width:160px;}
.filters label{margin-top:0;}
.dash-empty{padding:26px;text-align:center;color:var(--ink-soft);font-size:.9rem;}

/* Rater codes */
.codecell{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.ratercode{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;font-weight:700;
  letter-spacing:2px;color:var(--maroon-dark);background:#fff;border:1.5px dashed var(--gold);
  border-radius:8px;padding:8px 14px;cursor:pointer;user-select:all;white-space:nowrap;
}
.ratercode:hover{background:#fff8e8;}
.codeacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.codeacts .btn{padding:7px 12px;font-size:.75rem;min-height:0;}

/* Public landing / sign-in */
.hero{text-align:center;padding:6px 0 2px;}
.hero h2{font-family:var(--serif);color:var(--maroon-dark);font-size:1.5rem;margin:0 0 6px;}
.hero p{color:var(--ink-soft);font-size:.92rem;margin:0 auto 18px;max-width:520px;line-height:1.55;}
.bigcode{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;letter-spacing:4px;
  text-align:center;text-transform:uppercase;padding:16px 12px;
}
.who-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;}

/* Landing: two clearly separated doors — raters on the left, staff on the right */
.gate{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;}
.gate > .card{margin-bottom:0;display:flex;flex-direction:column;}
.gate > .card .gate-foot{margin-top:auto;}
.gatehead{display:flex;align-items:center;gap:10px;margin:-4px 0 10px;}
.gatehead .num{
  flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:1.05rem;font-weight:700;color:#fff;background:var(--maroon);
}
.gatehead .who-title{font-family:var(--serif);font-size:1.22rem;color:var(--maroon-dark);line-height:1.2;}
.gatehead .who-sub{font-size:.7rem;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);margin-top:2px;}
.card.gate-staff{background:#f7f8fc;border-color:#c9d0e6;}
.card.gate-staff .gatehead .num{background:var(--navy);}
.card.gate-staff .gatehead .who-title{color:var(--navy);}
.gate-or{
  text-align:center;font-size:.72rem;text-transform:uppercase;letter-spacing:2px;
  color:var(--ink-soft);margin:2px 0 14px;
}
@media (max-width:820px){
  .gate{grid-template-columns:1fr;}
  .gate > .card{margin-bottom:0;}
}

/* Phones and small tablets. iOS zooms the whole page whenever a focused
   input is smaller than 16px, which is what makes a form feel broken on a
   phone — so inputs are pinned to 16px here. */
@media (max-width:820px){
  input[type=text],input[type=email],input[type=date],textarea,select{
    font-size:16px;padding:12px 12px;
  }
  .btn{min-height:44px;padding:12px 18px;}
  .row>*{min-width:100%;}
  .linkbox{width:100%;}
  .linkbox input{width:100%;font-size:.8rem;}
  .rater-list li{align-items:flex-start;}
  .filters > div{min-width:100%;}
  nav.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  nav.tabs .tabbtn{flex:none;}
  .actions .btn{flex:1 1 auto;justify-content:center;}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
}

@media (max-width:480px){
  .wrap{padding:16px 10px 60px;}
  .card{padding:18px 16px;}
  .letterhead{padding:12px;gap:10px;}
  .letterhead h1{font-size:1rem;}
  .certificate{padding:20px 18px;}
  .certificate .top-logo img{max-width:76px;max-height:76px;}
  .cert-logos img{max-width:58px;max-height:58px;}
  .cert-logos .logo-ph{width:56px;height:56px;font-size:.45rem;}
  /* Deliberately nothing here for the certificate: on a phone it is scaled
     down as a picture by .sheet-scaler, never re-laid-out, so what a teacher
     approves on their phone is exactly what the printer produces. */
  .btn{padding:10px 14px;font-size:.85rem;}
  .linkbox input{width:150px;}
}

/* ---------------------------------------------------------------------
   PRINTING
   The pages already carry their exact paper dimensions, so printing needs
   almost nothing: hide the interface, undo the on-screen preview shrink,
   and let the fixed millimetre canvas fall onto the sheet 1:1.

   There is no scale-to-fit and no re-flow anywhere, which is what makes the
   printed certificate identical to the preview across browsers, operating
   systems, printers and PDF viewers.
   --------------------------------------------------------------------- */
@media print{
  @page{ size: A4 landscape; margin: 10mm; }
  html,body{background:#fff !important;margin:0 !important;padding:0 !important;height:auto !important;min-height:0 !important;overflow:visible !important;}
  .no-print{display:none !important;}
  .card{border:none;box-shadow:none;padding:0;}
  .wrap{max-width:none !important;width:auto !important;padding:0 !important;margin:0 !important;display:block !important;}
  nav.tabs,footer.site,.letterhead{display:none !important;}
  /* Only the certificate and its reference page are ever printed. */
  #app{display:block !important;margin:0 !important;padding:0 !important;gap:0 !important;}
  #app > *:not(.sheet-stage){display:none !important;position:absolute !important;height:0 !important;overflow:hidden !important;margin:0 !important;padding:0 !important;border:0 !important;}

  /* Plain block flow for printing: no flex, no transform, no preview sizing.
     Flex containers and transforms are what make some print engines split a
     page-sized box across several sheets. */
  .sheet-stage{display:block !important;width:auto !important;height:auto !important;margin:0 !important;padding:0 !important;}
  .sheet-scaler{display:block !important;transform:none !important;width:auto !important;height:auto !important;margin:0 !important;padding:0 !important;}

  /* Each sheet is one fixed, page-sized block. 1mm of slack inside the
     printable area stops rounding from spilling onto a new page. */
  .certificate,.backpage{
    display:flex;
    box-shadow:none !important;
    margin:0 auto !important;
    break-inside:auto;page-break-inside:auto;
    break-before:auto;break-after:auto;
  }
  /* Exactly two pages: a break after the front sheet only, never after the last. */
  .sheet-stage{break-after:page;page-break-after:always;}
  .sheet-stage ~ .sheet-stage{break-after:auto;page-break-after:auto;}
  .sheet-stage:last-of-type,.sheet-stage:last-child{break-after:auto !important;page-break-after:auto !important;}

  /* The upload prompt is an on-screen affordance only — never on paper. */
  .logo-ph{display:none;}
}

/* ===== Usability refinements ===== */
body{background:#ffffff;font-size:16px;line-height:1.5;}
.card{border-radius:14px;border-color:#e6e6e6;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.card h2{font-size:1.45rem;}
.card .sub{font-size:.97rem;}
label{font-size:.88rem;color:var(--ink);}
input[type=text],input[type=email],input[type=date],input[type=url],textarea,select{
  font-size:1rem;padding:12px 14px;border-radius:10px;background:#fff;
}
input[type=url]{width:100%;border:1px solid #d8d2c4;}
.btn{min-height:46px;border-radius:10px;font-size:.95rem;}
.btn-primary{box-shadow:0 2px 6px rgba(122,31,43,.25);}
.btn:focus-visible,a:focus-visible,.opt:focus-within{outline:3px solid var(--gold);outline-offset:2px;}
.notice{border-radius:10px;font-size:.92rem;}
/* Survey: bigger, clearer answer choices */
.opt{padding:14px 16px;border-radius:10px;gap:12px;align-items:center;transition:background .12s,border-color .12s;}
.opt input{width:22px;height:22px;accent-color:var(--maroon);margin:0;}
.opt.no-levels .txt{font-size:.97rem;line-height:1.5;}
.opt.selected{background:#fff6dc;border-color:var(--maroon);box-shadow:inset 3px 0 0 var(--maroon);}
.soft-item{padding:16px 0;}
.soft-item-title{font-size:1.05rem;}
.step-bar{height:10px;}
.step-pill{padding:7px 12px;font-size:.78rem;}
/* Keep Back / Next within thumb reach while scrolling long surveys */
.step-actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%);
  padding:18px 0 10px;margin-top:10px;z-index:5;}
.step-actions .btn{flex:1 1 140px;justify-content:center;}
.rater-list li{border-radius:12px;padding:16px 18px;}
.ratercode{font-size:1.3rem;}
nav.tabs{position:sticky;top:0;background:#ffffff;padding:8px 0;z-index:20;}
.stat{border-radius:12px;}
table.dash td,table.dash th{padding:10px 12px;}
@media (max-width:820px){
  .wrap{padding:16px 12px 70px;}
  .opt .lvl{flex-basis:100%;width:100%;}
}
@media print{ .step-actions,nav.tabs{display:none !important;} }

/* Item-by-item survey: one item per screen + numbered progress circles */
.q-step{display:none;}
.q-step.active{display:block;}
.soft-item.q-step{border-top:none;padding-top:0;}
.q-nav-label{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px;}
.q-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;}
.q-dot{width:40px;height:40px;border-radius:50%;border:2px solid #d9d0bd;background:#fff;color:var(--ink-soft);
  font-family:var(--sans);font-weight:700;font-size:.88rem;cursor:pointer;padding:0;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;}
.q-dot:disabled{opacity:.5;cursor:not-allowed;}
.q-dot.answered{background:var(--green);border-color:var(--green);color:#fff;}
.q-dot.current{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,31,43,.25);transform:scale(1.08);}
.q-dot.answered.current{background:var(--green);border-color:var(--maroon);}
.q-dot.missing{border-color:#d9573f;color:#b3401f;background:#fff1ee;}
.q-hint{display:none;color:#b3401f;font-size:.88rem;font-weight:600;margin:12px 0 0;}
.soft-item.needs-answer .q-hint{display:block;}
@media (max-width:480px){ .q-dot{width:36px;height:36px;font-size:.82rem;} .q-nav{gap:6px;} }

/* ============================================================
   FULL-SCREEN SURVEY (no scrolling) - phones, tablets, laptops
   ============================================================ */
.survey-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px;}
.survey-top .st-id{display:flex;align-items:center;gap:12px;flex:0 1 32%;min-width:0;}
.survey-top .st-name{min-width:0;display:flex;flex-direction:column;gap:1px;}
.survey-top .learner{font-family:var(--serif);font-weight:700;color:var(--maroon-dark);font-size:1.12rem;line-height:1.15;overflow-wrap:anywhere;}
.survey-top .school{font-size:.78rem;color:var(--ink-soft);line-height:1.2;}
.survey-top .st-title{flex:1 1 auto;text-align:center;font-family:var(--serif);font-weight:700;color:var(--maroon-dark);font-size:1.25rem;line-height:1.2;}
.done-badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:#eaf6ee;color:var(--green);font-size:.7rem;font-weight:700;}
.top-btns{display:flex;gap:6px;flex:none;}
.help-btn{min-width:34px;height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--maroon);background:#fff;color:var(--maroon);font-weight:700;font-size:.85rem;cursor:pointer;font-family:var(--sans);}
.help-btn:hover{background:#fff6dc;}
.step-pill .n{font-weight:700;}

html.survey-mode, html.survey-mode body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.survey-mode body{height:100vh;height:100dvh;min-height:0;}
html.survey-mode .wrap{height:100vh;height:100dvh;max-width:920px;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));}
html.survey-mode .wrap > :not(#app){display:none !important;}
html.survey-mode #app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
html.survey-mode #app > .survey-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:0;padding:10px 16px;}
html.survey-mode .survey-card > *{flex:none;}
html.survey-mode .step-progress{margin:0 0 6px;}
html.survey-mode .step-head{margin-bottom:4px;gap:6px;}
html.survey-mode .step-head .now{font-size:.95rem;}
html.survey-mode .step-head .count{font-size:.76rem;}
html.survey-mode .step-bar{height:6px;margin-bottom:6px;}
html.survey-mode .step-pills{flex-wrap:nowrap;gap:4px;margin-bottom:8px;}
html.survey-mode .step-pill{flex:0 0 auto;padding:4px 10px;font-size:.72rem;white-space:nowrap;}
html.survey-mode .step-pill.current{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
html.survey-mode .q-nav{flex-wrap:nowrap;gap:clamp(3px,.8vw,8px);margin:0;}
html.survey-mode .q-dot{flex:1 1 0;min-width:0;width:auto;max-width:40px;height:auto;aspect-ratio:1/1;font-size:clamp(.62rem,2.4vw,.88rem);}
html.survey-mode .q-dot.current{transform:none;}

/* the form and the one visible item take all the remaining height */
html.survey-mode #rater-form{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:10px;}
html.survey-mode .skill-block{border-top:none;padding-top:0;margin-top:0;}
html.survey-mode .skill-block > h3, html.survey-mode .skill-block > .desc{display:none;}
html.survey-mode .skill-step.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
html.survey-mode .skill-step .q-step{display:none;}
html.survey-mode .skill-step.active .q-step.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;
  margin:0;padding:0;font-size:calc(var(--fs,1) * 1rem);}
html.survey-mode .q-step .soft-section-label{font-size:.7em;margin:0 0 4px;}
html.survey-mode .q-step .soft-item-title{font-size:1.18em;line-height:1.25;margin:0 0 3px;}
html.survey-mode .q-step .soft-item-prompt{font-size:.9em;line-height:1.35;margin:0 0 .6em;}
html.survey-mode .q-step .opt{display:flex;flex-wrap:nowrap;align-items:center;gap:.7em;padding:.55em .75em;margin:0 0 .45em;border-radius:10px;}
html.survey-mode .q-step .opt .txt{font-size:1em;line-height:1.35;flex:1 1 auto;}
html.survey-mode .q-step .opt input{width:1.3em;height:1.3em;flex:none;}
html.survey-mode .q-hint{font-size:.8em;margin:.2em 0 0;}
html.survey-mode .step-actions{position:static;background:none;padding:8px 0 0;margin:0;}
html.survey-mode .step-actions .btn{min-height:46px;}

@media (max-width:640px){
  html.survey-mode .wrap{padding-left:calc(6px + env(safe-area-inset-left,0px));padding-right:calc(6px + env(safe-area-inset-right,0px));}
  html.survey-mode #app > .survey-card{border:0;box-shadow:none;padding:6px 6px;}
  html.survey-mode .step-pill:not(.current) .t{display:none;}
  html.survey-mode .step-pill{padding:4px 12px;}
}
/* phone held sideways / very short windows: free up every pixel for the item */
@media (max-height:520px){
  html.survey-mode .survey-top, html.survey-mode .step-pills, html.survey-mode .step-bar{display:none;}
  html.survey-mode #app > .survey-card{padding:4px 8px;}
  html.survey-mode .step-actions{padding-top:4px;}
  html.survey-mode .step-actions .btn{min-height:40px;}
}

/* tighter spacing used automatically when an item is long for the screen */
html.survey-mode #rater-form.tight .q-step .opt{padding:.32em .6em;margin-bottom:.28em;gap:.55em;border-radius:8px;}
html.survey-mode #rater-form.tight .q-step .opt .txt{line-height:1.2;}
html.survey-mode #rater-form.tight .q-step .soft-item-title{line-height:1.15;margin-bottom:2px;}
html.survey-mode #rater-form.tight .q-step .soft-item-prompt{line-height:1.25;margin-bottom:.4em;}
html.survey-mode #rater-form.tight .q-step .soft-section-label{margin-bottom:2px;}

/* short portrait screens (small phones): slim header, no skill-name pills */
@media (max-height:760px){
  html.survey-mode .step-pills{display:none;}
  html.survey-mode .step-bar{margin-bottom:5px;}
  html.survey-mode #rater-form{margin-top:6px;}
  html.survey-mode .step-actions .btn{min-height:42px;}
  html.survey-mode .help-btn{min-width:30px;height:30px;}
}
@media (max-height:700px){
  html.survey-mode .step-bar{display:none;}
  html.survey-mode .step-head{margin-bottom:3px;}
}

/* short, wide screens (phone on its side, low laptop windows): question on the
   left, answers on the right, so both fit at a readable size */
@media (orientation:landscape) and (max-height:720px){
  html.survey-mode .skill-step.active .q-step.active{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);
    column-gap:18px;grid-template-rows:auto auto 1fr;align-content:start;}
  html.survey-mode .q-step .soft-section-label,
  html.survey-mode .q-step .soft-item-title,
  html.survey-mode .q-step .soft-item-prompt{grid-column:1;}
  html.survey-mode .q-step .opts{grid-column:2;grid-row:1 / span 4;}
  html.survey-mode .q-step .q-hint{grid-column:1;}
}

/* answer text: regular weight (the global label style made it bold and wide) */
html.survey-mode .q-step .opt{font-weight:400;color:var(--ink);margin-top:0;}
html.survey-mode .q-step .opt .txt{font-weight:400;}
html.survey-mode .q-step .opt.selected .txt{font-weight:400;}
html.survey-mode .step-head{flex-wrap:nowrap;align-items:baseline;}
html.survey-mode .step-head .now{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
html.survey-mode .step-head .count{flex:none;white-space:nowrap;}
@media (orientation:landscape) and (max-height:520px){
  html.survey-mode .q-dot{max-width:26px;font-size:.66rem;}
  html.survey-mode .step-head{margin-bottom:2px;}
  html.survey-mode .step-head .now{font-size:.85rem;}
  html.survey-mode .step-actions{padding-top:4px;}
  html.survey-mode .step-actions .btn{min-height:36px;padding-top:4px;padding-bottom:4px;}
  html.survey-mode .skill-step.active .q-step.active{grid-template-columns:minmax(0,32%) minmax(0,1fr);column-gap:14px;}
  html.survey-mode #rater-form{margin-top:4px;}
}

/* if one item truly cannot fit at a readable size, only that item scrolls, with a fade hint */
html.survey-mode .q-step.scrolls{-webkit-overflow-scrolling:touch;box-shadow:inset 0 -16px 12px -12px rgba(0,0,0,.28);}

@media (max-height:700px){
  html.survey-mode .wrap{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));}
  html.survey-mode .survey-top{margin-bottom:2px;}
  html.survey-mode .done-badge{display:none;}
  html.survey-mode .help-btn{min-width:26px;height:26px;font-size:.75rem;padding:0 8px;}
  html.survey-mode .step-head .now{font-size:.85rem;}
  html.survey-mode .step-actions{padding-top:5px;}
  html.survey-mode .step-actions .btn{min-height:38px;}
}
/* phone on its side: progress title and numbered circles share one row */
@media (orientation:landscape) and (max-height:520px){
  html.survey-mode .step-progress{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  html.survey-mode .step-head{flex:0 0 auto;margin:0;max-width:34%;}
  html.survey-mode .step-head .count{display:none;}
  html.survey-mode .q-nav{flex:1 1 auto;}
  html.survey-mode #app > .survey-card{padding:2px 6px;}
}

/* Public landing: three tabs, one panel at a time */
.landing-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px;}
.landing-tabs .tabbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;
  background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:10px 6px;min-height:56px;line-height:1.2;
  color:var(--ink-soft);font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:rgba(122,31,43,.15);}
.landing-tabs .tabbtn b{font-size:.92rem;font-weight:700;}
.landing-tabs .tabbtn small{font-size:.72rem;opacity:.85;}
.landing-tabs .tabbtn:hover{border-color:var(--gold);}
.landing-tabs .tabbtn.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.gate-one{max-width:640px;margin:0 auto;}
.gate-one .card{margin-bottom:0;}
@media (max-width:480px){ .landing-tabs{gap:5px;} .landing-tabs .tabbtn b{font-size:.8rem;} .landing-tabs .tabbtn small{font-size:.66rem;} }
/* ===== Learner photo in survey + feedback boxes + certificate summary ===== */
.survey-photo{width:84px;height:105px;flex:none;border-radius:10px;object-fit:cover;border:2px solid var(--gold);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);}
@media (max-width:640px){
  .survey-top{flex-wrap:wrap;}
  .survey-top .st-id{flex:1 1 auto;order:1;}
  .survey-top .top-btns{order:2;}
  .survey-top .st-title{order:3;flex:1 1 100%;font-size:1rem;}
  .survey-photo{width:64px;height:80px;}
  .survey-top .learner{font-size:1rem;}
}
@media (max-height:700px){ .survey-photo{width:52px;height:65px;} .survey-top .st-title{font-size:1rem;} .survey-top .learner{font-size:.95rem;} .survey-top .school{display:none;} }
@media (orientation:landscape) and (max-height:520px){ .survey-photo{width:38px;height:48px;border-width:1px;} .survey-top .st-title{font-size:.85rem;} .survey-top .learner{font-size:.85rem;} }
.fb-box textarea.fb-text.fb-missing{border-color:#d9573f;background:#fff1ee;}
.survey-photo.big{width:84px;height:84px;}
.photo-up{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.photo-up img{width:70px;height:90px;object-fit:cover;border:1px solid #d8d2c4;border-radius:6px;background:#fff;}
.fb-box{margin-top:.6em;}
.fb-box .fb-label{display:block;font-size:.8em;font-weight:700;color:var(--maroon-dark);margin:0 0 3px;}
.fb-box .fb-label small{font-weight:400;color:var(--ink-soft);}
.fb-box textarea.fb-text{width:100%;min-height:3.4em;resize:none;font-size:16px;padding:8px 10px;border-radius:8px;}
.fb-box .fb-count{font-size:.72em;color:var(--ink-soft);text-align:right;margin-top:2px;}
.fb-summary{
  flex:none; border:.25mm solid var(--paper-line); background:#fbf8f0;
  padding:1.1mm 2.5mm; margin:0 0 1.5mm; font-size:7.4pt; line-height:1.28; color:var(--ink);
}
.fb-summary b{color:var(--maroon-dark);}
</style>

// Marks options that should NOT be scored ("hindi ko/niya/ako madalas
// ginagawa" and "walang pagkakataong ma-obserbahan") — same detection the
// dashboard's 360° tool uses, matched by wording rather than position since
// some item lists carry one such option and some carry two.
function isSoftNAOption(text){
  return /Hindi (ko|niya|ako|madalas)[^]*ginagawa/i.test(text) ||
         /Hindi ako nagkaroon ng pagkakataong/i.test(text);
}
// Maps this file's skill keys onto the item bank's competency keys.
const SOFT_COMPETENCY_KEY = {
  communication: "communication",
  teamwork: "teamwork",
  leadership: "leadership",
  problemSolving: "problemsolving"
};
/** Item list for a competency + role. Self-Rating uses the "learner"
    (first-person) wording; Teacher and both Nominated Raters use the
    "rater" (third-person) wording — same as the source survey instruments. */
function softQuestionsFor(skillKey, role){
  const set = SOFT_DATA[SOFT_COMPETENCY_KEY[skillKey]];
  if(!set) return [];
  return role === "self" ? set.learner : set.rater;
}
/** Number of scoreable (non-N/A) options for item `qi` of a competency.
    Verified against the source item bank: the learner (self) and rater
    (observer) wordings for the same item always carry the same count of
    real, scoreable options — only the N/A-style options differ in number —
    so an item's category count is a property of the item, not the role
    answering it, and item-level responses from different roles can be
    pooled on the same measurement scale. */
function itemRealCount(skillKey, qi){
  const qs = softQuestionsFor(skillKey, "teacher");
  const q = qs[qi];
  if(!q) return null;
  return q.options.filter(o=>!isSoftNAOption(o)).length;
}

/* ═══════════════════════════════════════════════════════════════════════
   MANY-FACET RASCH MEASUREMENT (MFRM)
   Replaces the old "average the option-ranks" scorer. Every rater's raw,
   item-by-item answers (collectResponses(), below) are pooled per
   competency into one measurement model with three facets:
     • Person   — the learner's proficiency (θ), the one figure we report
     • Rater    — each rater's severity/leniency (α) — self, teacher, and
                   both nominated raters do not all grade at the same
                   standard, and MFRM adjusts for that instead of just
                   averaging their raw picks
     • Item     — each survey item's difficulty (β)
   plus a set of Andrich category thresholds (τ), shared across items that
   have the same number of scoreable options (a Rating Scale Model
   structure — with at most a handful of ratings per item there is not
   enough data to calibrate a separate step structure per item).

   Estimation is unconditional joint maximum likelihood (JMLE): the classic
   Rasch "UCON" approach also used by Facets/Winsteps — repeatedly walk
   every parameter, move it by (observed − expected) ÷ (model information),
   and re-centre each facet to identify the scale, until the estimates stop
   moving. See Linacre, "A User's Guide to FACETS", or Wright & Masters
   (1982) Rating Scale Analysis for the underlying method.
   ═══════════════════════════════════════════════════════════════════════ */

/** Category probabilities for one response, given the person-minus-rater-
    minus-item logit `nu` and the (m-1)-length Andrich threshold vector for
    an m-category item. Cumulative-logit (Andrich/Masters) form. */
function mfrmCatProbs(nu, tau, m){
  const Z = [0];
  for(let k=1;k<m;k++) Z.push(Z[k-1] + nu - tau[k-1]);
  const mx = Math.max.apply(null, Z);
  const ex = Z.map(z=>Math.exp(z-mx));
  const s = ex.reduce((a,b)=>a+b,0);
  return ex.map(e=>e/s);
}
function mfrmExpVar(p){
  let e = 0; p.forEach((pk,k)=> e += k*pk);
  let v = 0; p.forEach((pk,k)=> v += (k-e)*(k-e)*pk);
  return {e, v};
}
function mfrmClamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

/** design = [{rater, item, k, m}, ...] — one row per scored (non-N/A) item
    response, k = the chosen category (0-based), m = that item's category
    count. Returns the fitted person measure, rater severities, item
    difficulties and step calibrations. */
function fitMFRM(design, opts){
  opts = opts || {};
  const maxIter = opts.maxIter || 300, tol = opts.tol || 0.0005;
  const raters = Array.from(new Set(design.map(d=>d.rater)));
  const items  = Array.from(new Set(design.map(d=>d.item)));
  const groups = {};
  design.forEach(d=>{ if(!groups[d.m]) groups[d.m] = new Array(d.m-1).fill(0); });

  let theta = 0;
  const alpha = {}; raters.forEach(r=> alpha[r]=0);
  const beta  = {}; items.forEach(i=> beta[i]=0);
  const nu = d => theta - alpha[d.rater] - beta[d.item];

  for(let iter=0; iter<maxIter; iter++){
    let maxDelta = 0;

    // --- person (θ) ---
    { let obs=0, exp=0, info=0;
      design.forEach(d=>{ const p=mfrmCatProbs(nu(d), groups[d.m], d.m); const ev=mfrmExpVar(p); obs+=d.k; exp+=ev.e; info+=ev.v; });
      if(info>1e-6){ const delta = mfrmClamp((obs-exp)/info, -1, 1); theta += delta; maxDelta=Math.max(maxDelta, Math.abs(delta)); }
    }
    // --- raters (α), then re-centred to mean 0 ---
    raters.forEach(r=>{
      let obs=0, exp=0, info=0;
      design.filter(d=>d.rater===r).forEach(d=>{ const p=mfrmCatProbs(nu(d), groups[d.m], d.m); const ev=mfrmExpVar(p); obs+=d.k; exp+=ev.e; info+=ev.v; });
      if(info>1e-6){ const delta = mfrmClamp((exp-obs)/info, -1, 1); alpha[r]+=delta; maxDelta=Math.max(maxDelta, Math.abs(delta)); }
    });
    if(raters.length){ const m0 = raters.reduce((s,r)=>s+alpha[r],0)/raters.length; raters.forEach(r=> alpha[r]-=m0); }

    // --- items (β), then re-centred to mean 0 ---
    items.forEach(i=>{
      let obs=0, exp=0, info=0;
      design.filter(d=>d.item===i).forEach(d=>{ const p=mfrmCatProbs(nu(d), groups[d.m], d.m); const ev=mfrmExpVar(p); obs+=d.k; exp+=ev.e; info+=ev.v; });
      if(info>1e-6){ const delta = mfrmClamp((exp-obs)/info, -1, 1); beta[i]+=delta; maxDelta=Math.max(maxDelta, Math.abs(delta)); }
    });
    if(items.length){ const m0 = items.reduce((s,i)=>s+beta[i],0)/items.length; items.forEach(i=> beta[i]-=m0); }

    // --- step (τ) calibrations, per category-count group, re-centred ---
    Object.keys(groups).forEach(mKey=>{
      const m = Number(mKey), tau = groups[mKey];
      for(let j=1;j<m;j++){
        let obsInd=0, expInd=0, info=0;
        design.filter(d=>d.m===m).forEach(d=>{
          const p = mfrmCatProbs(nu(d), tau, m);
          let cum=0; for(let k=j;k<m;k++) cum+=p[k];
          expInd += cum; obsInd += (d.k>=j ? 1 : 0); info += cum*(1-cum);
        });
        if(info>1e-6){ const delta = mfrmClamp((expInd-obsInd)/info, -1, 1); tau[j-1]+=delta; maxDelta=Math.max(maxDelta, Math.abs(delta)); }
      }
      const tmean = tau.reduce((s,v)=>s+v,0)/tau.length;
      for(let j=0;j<tau.length;j++) tau[j]-=tmean;
    });

    if(maxDelta < tol) break;
  }

  function infoSum(filterFn){
    let info=0;
    design.filter(filterFn).forEach(d=>{ const p=mfrmCatProbs(nu(d), groups[d.m], d.m); info += mfrmExpVar(p).v; });
    return info;
  }
  const se = f => 1/Math.sqrt(Math.max(f, 1e-6));
  const raterOut = {}; raters.forEach(r=> raterOut[r] = {severity: alpha[r], se: se(infoSum(d=>d.rater===r))});
  const itemOut  = {}; items.forEach(i=> itemOut[i]  = {difficulty: beta[i],  se: se(infoSum(d=>d.item===i))});

  return {theta, se: se(infoSum(()=>true)), alpha: raterOut, beta: itemOut, groups, n: design.length, raters, items};
}

/** Maps a fitted person measure (θ, in logits) back onto the same 1-5
    level scale the certificate/legend has always used, by asking: what
    score would this learner be expected to get on a reference item of
    average difficulty, rated by a rater of average severity? That keeps
    everything downstream (certificate, legend, dashboard) unchanged. */
function mfrmLevelForSkill(fit, skillKey){
  if(!fit || fit.n===0) return {level:1, raw:0};
  const bank = softQuestionsFor(skillKey, "teacher");
  const counts = {};
  bank.forEach((q, qi)=>{ const m = itemRealCount(skillKey, qi); if(m) counts[m] = (counts[m]||0)+1; });
  const refM = Number(Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]) || 5;
  const tau = fit.groups[refM] || new Array(Math.max(refM-1,1)).fill(0);
  const p = mfrmCatProbs(fit.theta, tau, refM);
  const raw = mfrmExpVar(p).e / Math.max(refM-1, 1);
  const level = Math.min(5, Math.max(1, Math.round(raw*4) + 1));
  return {level, raw, refM};
}

/** Pools every rater's raw, item-level answers for one skill into the
    design matrix fitMFRM() expects. A rater only contributes rows for
    items they actually scored (N/A / "no chance to observe" picks are
    skipped, same as before). Submissions saved before this measurement
    model existed only kept a 1-5 level, not item detail — those are still
    honoured, as a single synthetic 5-category item unique to that rater,
    so old and new submissions can mix in the same certificate. */
function buildMFRMDesign(a, skillKey){
  const design = [];
  ROLE_ORDER.forEach(role=>{
    const rr = a.raters[role];
    if(!rr || rr.status !== "done" || !rr.responses) return;
    const resp = rr.responses[skillKey];
    if(resp === null || resp === undefined || resp === "unobserved") return;
    if(typeof resp === "number"){
      const k = Math.min(4, Math.max(0, Math.round(resp) - 1));
      design.push({rater: role, item: "legacy:"+role, k, m: 5});
      return;
    }
    (resp.k || []).forEach((k, qi)=>{
      if(k === null || k === undefined) return;
      const m = itemRealCount(skillKey, qi);
      if(!m || m < 2) return;
      design.push({rater: role, item: qi, k, m});
    });
  });
  return design;
}

/* ---------------------------------------------------------
   DEVICE STORAGE SHIM
   Some phones refuse localStorage outright: iOS Safari in Private mode,
   Android WebViews inside Messenger/Gmail/Drive, and pages opened straight
   from a file on certain builds. When that happens localStorage.setItem
   throws, the pasted Web App URL is silently thrown away, and the tool looks
   broken. Everything is therefore mirrored in memory first, so the current
   session always works, and the UI warns when nothing can be remembered.
--------------------------------------------------------- */
const MEM = Object.create(null);
let STORAGE_PERSISTS = null;
function storagePersists(){
  if (STORAGE_PERSISTS !== null) return STORAGE_PERSISTS;
  try{
    localStorage.setItem("__als_probe", "1");
    localStorage.removeItem("__als_probe");
    STORAGE_PERSISTS = true;
  }catch(e){ STORAGE_PERSISTS = false; }
  return STORAGE_PERSISTS;
}
function lsGet(k){
  try{
    const v = localStorage.getItem(k);
    if (v !== null && v !== undefined) return v;
  }catch(e){}
  return (k in MEM) ? MEM[k] : null;
}
function lsSet(k, v){
  MEM[k] = v;                                  // always succeeds
  try{ localStorage.setItem(k, v); }catch(e){} // best effort
}
function lsDel(k){
  delete MEM[k];
  try{ localStorage.removeItem(k); }catch(e){}
}

/* ---------------------------------------------------------
   CONFIGURATION
   Settings the coordinator enters once per device (Settings tab).
   They are kept in this browser only — never inside the shared file —
   so the same HTML can be handed out freely.
--------------------------------------------------------- */
const CFG_KEY = "als_mc_config_v2";
const DEFAULT_CFG = {
  apiUrl: "",              // Google Apps Script /exec URL — this is what makes IDs work everywhere
  coordKey: "",            // coordinator key — unlocks the teacher area. Raters never have this.
  dashLock: "BAE-BUTTERFLY-26",     // dashboard privacy passphrase — set here so Settings shows the live value
  settingsLock: "BAE-BUTTERFLY-26", // settings privacy passphrase — set here so Settings shows the live value
  msClientId: "",          // Azure app registration Application (client) ID, for OneDrive
  msTenant: "common",      // "common", or your DepEd tenant ID
  oneDriveFolder: "ALS Micro-Certificates"
};
function getConfig(){
  let cfg;
  try{ cfg = Object.assign({}, DEFAULT_CFG, JSON.parse(lsGet(CFG_KEY)) || {}); }
  catch(e){ cfg = Object.assign({}, DEFAULT_CFG); }
  // A URL baked into the file is the fallback, so a freshly-downloaded copy
  // already knows where the database is.
  if (!cfg.apiUrl && EMBEDDED_API_URL) cfg.apiUrl = EMBEDDED_API_URL;
  return cfg;
}
function setConfig(cfg){
  lsSet(CFG_KEY, JSON.stringify(Object.assign(getConfig(), cfg)));
}
function hasApi(){ return !!getConfig().apiUrl; }

/* ---------------------------------------------------------
   DASHBOARD PRIVACY LOCK
   The dashboard lists every learner in the division at once — a bulk view
   of personal data the coordinator key alone was never meant to gate on
   its own (many teachers can hold that key just to open their own
   learners' forms). This adds a second, narrower passphrase in front of
   the dashboard specifically, in the spirit of the Data Privacy Act's
   access-control principle: only unlock the wide view when someone
   deliberately asks for it, and forget that unlock again once the tab
   closes. It is a screen lock for a shared/unattended device, not
   encryption — the underlying data is only as protected as the shared
   database itself.
--------------------------------------------------------- */
const DASH_LOCK_DEFAULT = "BAE-BUTTERFLY-26";
const DASH_UNLOCK_KEY = "als_dash_unlocked_v1";
function dashPassphrase(){
  const c = getConfig();
  return (c.dashLock && c.dashLock.trim()) ? c.dashLock.trim() : DASH_LOCK_DEFAULT;
}
function isDashUnlocked(){
  try{ return sessionStorage.getItem(DASH_UNLOCK_KEY) === "1"; }
  catch(e){ return false; }
}
function setDashUnlocked(v){
  try{
    if (v) sessionStorage.setItem(DASH_UNLOCK_KEY, "1");
    else sessionStorage.removeItem(DASH_UNLOCK_KEY);
  }catch(e){}
}
function renderDashboardLock(){
  app.innerHTML = `
    ${storageBanner()}
    <div class="card">
      <h2>&#128274; Dashboard locked</h2>
      <p class="sub">This dashboard lists every learner in the division at once — names, schools and ratings together in one place. To protect that data, per the Data Privacy Act, it stays locked behind its own passphrase even on a device already signed in as a teacher or coordinator.</p>
      <label for="dash-pass">Dashboard passphrase</label>
      <input type="text" id="dash-pass" class="bigcode" placeholder="Enter dashboard passphrase" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <div class="actions" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="tryDashUnlock()">Unlock dashboard</button>
      </div>
      <div id="dash-pass-result" style="margin-top:10px;"></div>
      <p class="smallnote">This unlock is remembered only for the rest of this browser tab — closing it, or tapping <b>Lock dashboard</b> inside, locks it again. Ask your ALS coordinator for the passphrase.</p>
    </div>`;
  const inp = document.getElementById("dash-pass");
  if (inp){
    inp.focus();
    inp.addEventListener("keydown", e=>{ if (e.key === "Enter") tryDashUnlock(); });
  }
}
function tryDashUnlock(){
  const v = (document.getElementById("dash-pass") || {}).value || "";
  const box = document.getElementById("dash-pass-result");
  if (v.trim().toUpperCase() === dashPassphrase().toUpperCase()){
    setDashUnlocked(true);
    renderDashboard();
  } else if (box){
    box.innerHTML = `<div class="notice err">That passphrase doesn\'t match. Check with your ALS coordinator.</div>`;
  }
}
function lockDashboardNow(){
  setDashUnlocked(false);
  renderDashboard();
}

/* ---------------------------------------------------------
   SETTINGS PRIVACY LOCK
   Same idea as the dashboard lock above, but in front of the Settings
   screen — the database address, coordinator key and OneDrive credentials

/* ---------------------------------------------------------
   SHARED BACKEND
   Every request is a POST with Content-Type text/plain. That keeps it a
   "simple" cross-origin request, so the browser never sends a preflight
   that Google Apps Script cannot answer — which is why this works from
   any device, on any network, with the file opened from anywhere.
--------------------------------------------------------- */
async function api(action, payload){
  const cfg = getConfig();
  if(!cfg.apiUrl) throw new Error("NO_API");
  const body = Object.assign({action, key: cfg.coordKey || ""}, payload || {});
  const res = await fetch(cfg.apiUrl, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(body),
    redirect: "follow"
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error("The link responded with something unexpected. Re-check the Web App URL — it must end in /exec and be deployed with access set to \"Anyone\"."); }
  return data;
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
/** Same call as api(), but rides out a flaky connection (mobile data, school
    wifi) instead of surrendering to the first hiccup. Only retries on a
    network/transport failure — if the server actually answers (even with an
    error payload), that answer is returned/thrown immediately since retrying
    it would just get the same answer. */
async function apiWithRetry(action, payload, attempts){
  attempts = attempts || 3;
  let lastErr;
  for (let i = 0; i < attempts; i++){
    try{ return await api(action, payload); }
    catch(e){
      lastErr = e;
      if (i < attempts - 1) await sleep(600 * (i + 1));
    }
  }
  throw lastErr;
}

/* ---------------------------------------------------------
   PENDING RATER SUBMISSIONS
   A rater's completed answers are queued to this device the instant they hit
   Submit — before the network call is even attempted — so a dropped
   connection never loses them. If raterSubmit doesn't go through right away,
   the queue is what the automatic background retry (see submitByCode) and
   any later visit to this same link or page reload draw on to keep trying,
   with no copy-paste step required from the rater.
--------------------------------------------------------- */
const PENDING_RATER_KEY = "als_mc_pending_raters_v1";
function loadPendingRaterQueue(){ try{ return JSON.parse(lsGet(PENDING_RATER_KEY)) || {}; }catch(e){ return {}; } }
function savePendingRaterQueue(q){ lsSet(PENDING_RATER_KEY, JSON.stringify(q)); }
function queuePendingRaterSubmission(code, role, responses){
  const q = loadPendingRaterQueue();
  q[code] = {code, role, responses, ts: Date.now()};
  savePendingRaterQueue(q);
}
function clearPendingRaterSubmission(code){
  const q = loadPendingRaterQueue();
  if (q[code]){ delete q[code]; savePendingRaterQueue(q); }
}
/** Best-effort resend of anything still queued on this device. Called
    whenever a rater form is opened and whenever the browser comes back
    online, so a submission queued during an earlier dropped connection gets
    a chance to go through without the rater doing anything. */
async function flushPendingRaterSubmissions(){
  if (!hasApi()) return;
  const q = loadPendingRaterQueue();
  for (const code of Object.keys(q)){
    try{
      const r = await api("raterSubmit", {code: q[code].code, responses: q[code].responses});
      if (r && r.ok) clearPendingRaterSubmission(code);
    }catch(e){ /* still offline/unreachable — stays queued for next time */ }
  }
}
window.addEventListener("online", () => { flushPendingRaterSubmissions(); });

/* ---------------------------------------------------------
   STORAGE
   1. Shared backend (above) — the system of record. Any device that has
      the Web App URL configured can open any Assessment ID.
   2. window.storage — used when this page runs as a Claude artifact.
   3. localStorage — offline cache and last-resort fallback.
--------------------------------------------------------- */
const DB_KEY = "als_mc_assessments_v1";
const HAS_CLOUD = !!(window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function");

function loadLocalDB(){ try{ return JSON.parse(lsGet(DB_KEY)) || {}; }catch(e){ return {}; } }
function saveLocalDB(db){ lsSet(DB_KEY, JSON.stringify(db)); }
function saveLocalAssessment(a){ const db = loadLocalDB(); db[a.id]=a; saveLocalDB(db); }
function listLocalAssessments(){ const db = loadLocalDB(); return Object.keys(db).map(k=>db[k]); }

/* Set when a save could not reach the shared backend, so the UI can say so. */
let LAST_SYNC_ERROR = "";

async function loadAssessment(id){
  id = String(id||"").trim().toUpperCase();
  if (hasApi()) {
    try{
      const r = await api("get", {id});
      if(r && r.ok && r.assessment){
        saveLocalAssessment(r.assessment);
        LAST_SYNC_ERROR = "";
        return r.assessment;
      }
      if(r && r.error === "BAD_SECRET") LAST_SYNC_ERROR = "The access phrase in Settings does not match the one in the Apps Script.";
    }catch(e){
      LAST_SYNC_ERROR = "Could not reach the shared database (" + e.message + ").";
    }
  }
  if (HAS_CLOUD) {
    try {
      const res = await window.storage.get("assessment:"+id, true);
      if (res && res.value) {
        const a = JSON.parse(res.value);
        saveLocalAssessment(a);
        return a;
      }
    } catch(e) { /* fall through */ }
  }
  return loadLocalDB()[id] || null;
}

async function saveAssessment(a){
  saveLocalAssessment(a);           // always keep a local copy first
  let synced = false;
  if (hasApi()) {
    try{
      const r = await api("save", {assessment: a});
      if(r && r.ok){ synced = true; LAST_SYNC_ERROR = ""; }
      else LAST_SYNC_ERROR = (r && r.message) || "The shared database rejected the save.";
    }catch(e){
      LAST_SYNC_ERROR = "Could not reach the shared database (" + e.message + "). Your answer is saved on this device and will need to be re-sent.";
    }
  }
  if (HAS_CLOUD) {
    try { await window.storage.set("assessment:"+a.id, JSON.stringify(a), true); synced = true; }
    catch(e) { /* local cache above still has it */ }
  }
  return synced;
}

function newId(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ---------------------------------------------------------
   Cross-device transfer: encode/decode a rater's submission
   as a portable code, so raters on OTHER devices can submit
   and send the code back to be merged in.
--------------------------------------------------------- */
function encodeSubmission(id, role, responses){
  const payload = {id, role, responses, ts:Date.now()};
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function decodeSubmission(code){
  try{ return JSON.parse(decodeURIComponent(escape(atob(code.trim())))); }
  catch(e){ return null; }
}

/* ---------------------------------------------------------
   ROUTING — hash based.
   Phones cannot navigate a locally-saved file with a query string:
   tapping a "?view=settings" link on an HTML file opened from Files,
   Drive or Documents gives "file not found", which is why Settings
   could not be opened on mobile. A hash ("#view=settings") never
   reloads the file, so it works everywhere — on a phone, from a USB
   stick, from email, and from a normal web server.
   Query strings are still READ, so links already sent out keep working.
--------------------------------------------------------- */
function parseParams(){
  const sp = new URLSearchParams(location.search);
  const hp = new URLSearchParams(location.hash.replace(/^#\??/, ""));
  hp.forEach((v, k) => sp.set(k, v));   // the hash wins when both are present
  return sp;
}
let params = parseParams();
const app = document.getElementById("app");
/* Guards the rater-code box so pasting or typing a complete code opens the
   form once — and only once — without waiting for Enter or a button click. */

/** Build an in-page href, e.g. hrefFor({view:"settings"}) -> "#view=settings" */
function hrefFor(obj){
  const sp = new URLSearchParams();
  Object.keys(obj || {}).forEach(k => {
    if (obj[k] !== null && obj[k] !== undefined && obj[k] !== "") sp.set(k, obj[k]);
  });
  const q = sp.toString();
  return q ? "#" + q : "#";
}

/** Switch view without ever reloading the file. */
function navTo(obj){
  const target = hrefFor(obj).slice(1);
  if (location.hash.replace(/^#/, "") === target){ params = parseParams(); render(); return; }
  location.hash = target;               // fires hashchange -> render()
}
window.addEventListener("hashchange", () => {
  params = parseParams();
  render();
  try{ window.scrollTo(0, 0); }catch(e){}
});

/** Absolute link to this same file, used for the links handed to raters. */
function selfUrl(obj){
  const base = location.href.split("#")[0].split("?")[0];
  return base + hrefFor(obj);
}

function b64(t){ return btoa(unescape(encodeURIComponent(t))); }
function unb64(t){ try{ return decodeURIComponent(escape(atob(t))); }catch(e){ return ""; } }

/**
 * Produce a copy of this whole tool with the division's database address
 * already written into it. Hand that file to teachers and raters and a bare
 * rater code works on any device, with nothing to paste and nothing to set up.
 *
 * The coordinator key is deliberately NOT included — the copy is safe to give
 * to raters.
 */
function downloadShareableCopy(){
  const cfg = getConfig();
  const box = document.getElementById("share-copy-msg");
  const say = (cls, msg) => { if (box) box.innerHTML = `<div class="notice ${cls}">${msg}</div>`; };
  if (!cfg.apiUrl){ say("err", "Set the Web App URL first."); return; }
  try{
    // Blank the live view so the saved copy opens on a clean landing screen.
    const appEl = document.getElementById("app");
    const navEl = document.getElementById("mainnav");
    const keptApp = appEl.innerHTML, keptNav = navEl.innerHTML;
    appEl.innerHTML = ""; navEl.innerHTML = "";
    let out = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    appEl.innerHTML = keptApp; navEl.innerHTML = keptNav;

    // Anchored to the start of a line so it can only ever match the
    // declaration, never the two references inside this function.
    const slot = /^const EMBEDDED_API_URL = "[^"]*"; \/\*ALS_API_SLOT\*\//m;
    if (!slot.test(out)){ say("err", "Couldn't find the address slot in this file. Re-download the original tool and try again."); return; }
    out = out.replace(slot, "const EMBEDDED_API_URL = " + JSON.stringify(cfg.apiUrl) + "; /*ALS_API_SLOT*/");

    const blob = new Blob([out], {type: "text/html;charset=utf-8"});
    const url  = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "ALS_Micro-certification_READY.html";
    link.click();
    URL.revokeObjectURL(url);
    say("ok", "Saved as <b>ALS_Micro-certification_READY.html</b>. Share that file with your teachers and raters — email it, drop it in a shared folder, or host it. Anyone who opens it can type a rater code straight away, on a phone or a computer. It does <b>not</b> contain the coordinator key.");
  }catch(e){
    say("err", "Couldn't build the copy: " + escapeHtml(e.message));
  }
}

/**
 * People paste all sorts of things into this box: the code with spaces, in
 * lower case, or the whole rating link copied out of Messenger. Accept the lot.
 */
function extractCode(raw){
  let t = String(raw || "").trim();
  const m = t.match(/[#&?]r=([A-Za-z0-9-]+)/);   // a full link was pasted
  if (m) t = m[1];
  return t.toUpperCase().replace(/[^A-Z0-9]/g, "");
}

    opens the survey form on its own, with no Enter key and no button click. */

let NEW_PHOTO = "";
/** Resize to a small JPEG (about 400px) so it syncs fast and stays under cell limits. */
function normalisePhoto(file, maxEdge){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("Couldn't read that image."));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("That file isn't a usable image."));
      img.onload = ()=>{
        const k = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
