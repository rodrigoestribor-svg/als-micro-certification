/* ---------- SURVEY FORM: FULL 360° ASSESSMENT TOOL ----------
   ctx = {role, roleLabel, learnerName, school, existing, isDone, onSubmit}
   Used by BOTH the rater (who arrived with their own code and sees nothing
   else) and the teacher (rating from inside the teacher area).

   This is the full item-by-item DepEd ALS 360° Survey — the same item bank
   used by the ALS Learner Dashboard's 360° Assessment Tool — not a single
   1-5 pick per skill. Self-Rating answers the first-person wording; the
   Teacher and both Nominated Raters answer the observer wording. Every item
   is required; each rater's raw item-by-item answers are kept as-is
   (collectResponses) and pooled across all four raters into a 1-5 level
   per competency via Many-Facet Rasch Measurement (fitMFRM /
   mfrmLevelForSkill), which is what feeds the existing certificate/legend
   below, exactly as a single 1-5 pick used to. */
/** Full-screen "no scrolling" layout is switched on whenever a survey form is
    on the page and off again as soon as anything else replaces it. */
let __surveyObs = null;
function watchSurveyMode(){
  const sync = ()=> document.documentElement.classList.toggle("survey-mode", !!document.getElementById("rater-form"));
  sync();
  if (__surveyObs) return;
  __surveyObs = new MutationObserver(sync);
  __surveyObs.observe(document.getElementById("app"), {childList:true});
}

function renderSurvey(ctx){
  const role     = ctx.role;
  const isDone   = !!ctx.isDone;
  const isSelf   = role === "self"; // learner answers first-person wording

  const exitId = (!params.get("r") && params.get("id")) ? params.get("id") : "";
  const exitHome = !!params.get("r");
  let html = `
    <div class="card survey-card">
<div class="survey-top">
        <div class="st-id">${ctx.photoUri ? `<img class="survey-photo" src="${ctx.photoUri}" alt="Photo of ${escapeHtml(ctx.learnerName||"the learner")}">` : ""}
          <div class="st-name"><span class="learner">${escapeHtml(ctx.learnerName || "")}</span>${ctx.school ? `<span class="school">${escapeHtml(ctx.school)}</span>` : ""}
          ${isDone ? '<span class="done-badge" title="Submitting again replaces your previous answers">Submitted before</span>' : ''}</div></div>
        <div class="st-title">${escapeHtml(({self:"Self-Assessment",teacher:"Teacher Assessment",rater2:"Nominated Rater 1 Assessment",rater3:"Nominated Rater 2 Assessment"})[role] || ctx.roleLabel || "Assessment")} Survey Tool</div>
        <div class="top-btns">
          ${(exitId || exitHome) ? '<button type="button" class="help-btn" id="exit-btn" title="Leave this form">Exit</button>' : ''}
          <button type="button" class="help-btn" id="help-btn" aria-label="How to answer" title="How to answer">?</button>
        </div>
      </div>
      <div class="step-progress" id="step-progress" aria-live="polite"></div>
      <form id="rater-form" onsubmit="return false;">
  `;
  SKILL_ORDER.forEach((skillKey, stepIdx)=>{
    const skill = SKILLS[skillKey];
    const questions = softQuestionsFor(skillKey, role);
    html += `<div class="skill-block skill-step${stepIdx===0?' active':''}" data-step="${stepIdx}" data-skill="${skillKey}">
      <h3>${skill.label}</h3>
      <p class="desc">${questions.length} item${questions.length===1?'':'s'} ${isSelf ? '' : ' &middot; then your Feedback to the Learner (required)'}.</p>`;
    let lastSection = null;
    questions.forEach((q, qi)=>{
      html += `<div class="soft-item q-step${qi===0?' active':''}" data-qi="${qi}">
        ${q.section ? `<div class="soft-section-label">${escapeHtml(q.section)}</div>` : ""}
        <p class="soft-item-title"><span class="num">${qi+1}.</span>${escapeHtml(q.title)}</p>
        <p class="soft-item-prompt">${escapeHtml(q.prompt)}</p>`;
      html += `<div class="opts">`;
      q.options.forEach((opt, oi)=>{
        html += `<label class="opt no-levels">
          <input type="radio" name="${skillKey}__q${qi}" value="${oi}" onchange="markSelected(this)">
          <span class="txt">${escapeHtml(opt)}</span>
        </label>`;
      });
      html += `</div><p class="q-hint" role="alert">Please choose one answer to continue.</p></div>`;
    });
    if (!isSelf) html += `<div class="soft-item q-step fb-step" data-qi="${questions.length}" data-fbstep="1">
        <div class="soft-section-label">Feedback to the Learner</div>
        <p class="soft-item-title"><span class="num">&#9998;</span>Feedback to the Learner &mdash; ${escapeHtml(skill.label)}</p>
        <p class="soft-item-prompt">Isulat ang inyong mungkahi o puna (feedback) para ${isSelf ? "sa inyong sarili" : "sa mag-aaral"} tungkol sa <b>${escapeHtml(skill.label)}</b>: ang mga lakas at kung ano pa ang maaaring pagbutihin.</p>
        <div class="fb-box">
          <label class="fb-label" for="${skillKey}__fbfinal">Feedback to the Learner <span class="fb-req" aria-hidden="true" style="color:#b3401f">*</span> <small>&middot; kailangan bago magpatuloy, hanggang ${FB_MAX_WORDS} salita</small></label>
          <textarea class="fb-text" id="${skillKey}__fbfinal" name="${skillKey}__fbfinal" rows="6" required aria-required="true" oninput="fbCount(this)" placeholder="Isulat dito ang inyong feedback para sa mag-aaral&hellip;"></textarea>
          <div class="fb-count">0/${FB_MAX_WORDS} words</div>
        </div>
        <p class="q-hint" role="alert">Please write your Feedback to the Learner to continue.</p>
      </div>`;
    html += `</div>`;
  });
  html += `
      </form>
      <div class="actions step-actions">
        <button type="button" class="btn btn-outline" id="step-back">&larr; Back</button>
        <button type="button" class="btn btn-primary" id="step-next">Next skill &rarr;</button>
        <button type="button" class="btn btn-primary" id="submit-rating" style="display:none;">Review &amp; submit &rarr;</button>
      </div>
    </div>
  `;
  app.innerHTML = html;
  const staleSum = document.getElementById("sum-overlay");
  if (staleSum){ staleSum.remove(); document.body.style.overflow = ""; }

  /* ---- one-skill-at-a-time navigation ---- */
  const form   = document.getElementById("rater-form");
  const steps  = Array.from(form.querySelectorAll(".skill-step"));
  const total  = steps.length;
  let current  = 0;
  let maxDone  = -1;                       // highest step already completed

  /* ---- restore this rater's previously saved answers, if any ----
     ctx.existing holds { [skillKey]: {k: [...]} } exactly as collectResponses()
     produced it: k[qi] is the 0-based rank among that item's scoreable options,
     or null for an N/A pick. Without this step the form always renders blank
     on reopen, so a rater editing (or re-loading) an already-submitted rating
     would have to re-answer every item from scratch, and any that they didn't
     retouch would then wrongly trip the "answer every item" gate below. */
  (function restoreExisting(){
    if (!ctx.existing) return;
    SKILL_ORDER.forEach((skillKey)=>{
      const saved = ctx.existing[skillKey];
      if (!saved || !Array.isArray(saved.k)) return;
      const questions = softQuestionsFor(skillKey, role);
      saved.k.forEach((kv, qi)=>{
        const q = questions[qi];
        if (!q) return;
        let oi;
        if (kv === null || kv === undefined){
          oi = q.options.findIndex(o => isSoftNAOption(o));
        } else {
          const realIdx = [];
          q.options.forEach((o,i)=>{ if(!isSoftNAOption(o)) realIdx.push(i); });
          oi = realIdx[kv];
        }
        if (oi === undefined || oi < 0) return;
        const input = form.querySelector(`input[name="${skillKey}__q${qi}"][value="${oi}"]`);
        if (input){ input.checked = true; markSelected(input); }
      });
    });
  })();

  (function restoreFeedback(){
    if (!ctx.existing) return;
    SKILL_ORDER.forEach((skillKey)=>{
      const saved = ctx.existing[skillKey];
      if (!saved) return;
      let t = (typeof saved.feedback === "string") ? saved.feedback : "";
      if (!t && Array.isArray(saved.fb)) t = saved.fb.filter(x=>x && String(x).trim()).join(" ");   // older per-item feedback
      const ta = form.querySelector(`textarea[name="${skillKey}__fbfinal"]`);
      if (ta && t){ ta.value = String(t).split(/\s+/).filter(Boolean).slice(0, FB_MAX_WORDS).join(" "); fbCount(ta); }
    });
  })();
  form.addEventListener("focusin", (e)=>{
    if (e.target && e.target.tagName === "TEXTAREA"){
      const it = e.target.closest(".q-step"); if (it){ it.style.overflowY = "auto"; }
    }
  });

  const hasFb = (key)=>{ const ta = form.querySelector(`textarea[name="${key}__fbfinal"]`); return !!(ta && ta.value.trim()); };
  const nQ = (i)=> softQuestionsFor(SKILL_ORDER[i], role).length;          // rating items only
  // item index nQ is the final, mandatory "Feedback to the Learner" step
  const itemDoneKQ = (key, qi)=> qi >= softQuestionsFor(key, role).length ? hasFb(key) : !!form.querySelector(`input[name="${key}__q${qi}"]:checked`);
  const missingIn = (i)=>{
    const key = SKILL_ORDER[i];
    const out = [];
    for (let qi = 0; qi < itemCount(i); qi++){ if(!itemDoneKQ(key, qi)) out.push(qi); }
    return out;
  };
  const answeredIn = (i)=> itemCount(i) - missingIn(i).length;
  const itemAnswered = (i, qi)=> itemDoneKQ(SKILL_ORDER[i], qi);
  const itemCount = (i)=> nQ(i) + (isSelf ? 0 : 1);   // learners (self) have no feedback step
  // first step not completed yet (= itemCount when the skill is complete)
  const firstOpen = (i)=>{ const m = missingIn(i); return m.length ? m[0] : itemCount(i); };
  const qCur = SKILL_ORDER.map(()=>0);   // which item each skill is currently showing
  let autoTimer = null;

  // answers restored from a previous submission: let completed skills be revisited
  for (let i = 0; i < total; i++){ if (missingIn(i).length === 0) maxDone = i; else break; }

  function paintProgress(){
    const key = SKILL_ORDER[current];
    const n   = itemCount(current);
    const got = answeredIn(current);
    const open = firstOpen(current);
    const qi  = qCur[current];
    const pct = Math.round(((current + got/Math.max(n,1)) / total) * 100);

    let pills = "";
    SKILL_ORDER.forEach((k, i)=>{
      const cls = i===current ? "current" : (i<=maxDone ? "done" : "");
      const tick = (i<=maxDone && i!==current) ? "&#10003; " : "";
      pills += `<button type="button" class="step-pill ${cls}" data-goto="${i}" ${(i<=maxDone||i===current)?"":"disabled"} title="${escapeHtml(SKILLS[k].label)}">${tick}<span class="n">${i+1}</span><span class="t">. ${escapeHtml(SKILLS[k].label)}</span></button>`;
    });

    const items = steps[current].querySelectorAll(".q-step");
    let dots = "";
    for (let j = 0; j < n; j++){
      const ans = itemAnswered(current, j);
      const flagged = items[j] && items[j].classList.contains("needs-answer");
      const cls = "q-dot" + (ans ? " answered" : "") + (j===qi ? " current" : "") + (flagged && !ans ? " missing" : "");
      const reachable = ans || j <= open;
      dots += `<button type="button" class="${cls}" data-q="${j}" ${reachable?"":"disabled"} ${j===qi?'aria-current="step"':""} aria-label="${(!isSelf && j===n-1)?"Feedback to the Learner":"Item "+(j+1)+" of "+nQ(current)}${ans?", done":", not done yet"}">${(!isSelf && j===n-1)?"&#9998;":j+1}</button>`;
    }

    document.getElementById("step-progress").innerHTML = `
      <div class="step-head">
        <span class="now">Skill ${current+1}/${total} &middot; ${escapeHtml(SKILLS[key].label)}</span>
        <span class="count">${(!isSelf && qi===n-1) ? "Feedback to the Learner" : "Item " + (qi+1) + " of " + nQ(current)}</span>
      </div>
      <div class="step-bar"><i style="width:${pct}%"></i></div>
      <div class="step-pills">${pills}</div>
      <div class="q-nav">${dots}</div>`;
    document.querySelectorAll("#step-progress .step-pill.done").forEach(b=>{
      b.addEventListener("click", ()=> goStep(Number(b.dataset.goto)));
    });
    document.querySelectorAll("#step-progress .q-dot").forEach(b=>{
      b.addEventListener("click", ()=> goItem(Number(b.dataset.q)));
    });
  }

  /* ---- fit the current item inside the screen: no scrolling ----
     Starts at a comfortable (or, on big screens, generous) text size and
     shrinks in small steps until the question and all its answers fit. Only if
     it still cannot fit at the smallest readable size (e.g. a phone held
     sideways) does the item itself become scrollable as a last resort. */
  function fitItem(){
    const el = form.querySelector(".skill-step.active .q-step.active");
    if (!el || !document.documentElement.classList.contains("survey-mode")) return;
    if (el.classList.contains("fb-step")){ el.style.overflowY = "auto"; el.classList.remove("scrolls"); return; }
    const MIN = window.innerHeight < 700 ? 0.66 : 0.7;
    let fs = window.innerWidth < 600 ? 1.02 : (window.innerHeight >= 820 ? 1.3 : 1.14);
    el.style.overflowY = "hidden";
    form.style.setProperty("--fs", fs);
    let guard = 0;
    form.classList.remove("tight");
    while (el.scrollHeight > el.clientHeight + 1 && fs > MIN && guard++ < 60){
      fs = Math.max(MIN, +(fs - 0.03).toFixed(3));
      form.style.setProperty("--fs", fs);
      if (fs < 0.92 && !form.classList.contains("tight")) form.classList.add("tight");   // tighter spacing before smaller text
    }
    const needsScroll = el.scrollHeight > el.clientHeight + 1;
    if (needsScroll) el.style.overflowY = "auto";
    el.classList.toggle("scrolls", needsScroll);   // last resort on tiny screens: only this item scrolls
  }
  function fitSoon(){ requestAnimationFrame(()=> requestAnimationFrame(fitItem)); }
  if (window.__surveyFit) window.removeEventListener("resize", window.__surveyFit);
  window.__surveyFit = ()=>{ if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return; if (document.getElementById("rater-form")) fitSoon(); };
  window.addEventListener("resize", window.__surveyFit);
  window.addEventListener("orientationchange", window.__surveyFit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", window.__surveyFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);

  function showHelp(){
    const old = document.getElementById("help-overlay"); if (old) old.remove();
    const ov = document.createElement("div");
    ov.className = "sum-overlay"; ov.id = "help-overlay";
    ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    ov.innerHTML = `<div class="sum-modal">
      <h3>How to answer</h3>
      <p class="sub">Rating <b>${escapeHtml(ctx.learnerName || "")}</b>${ctx.school ? " (" + escapeHtml(ctx.school) + ")" : ""}. For each item, choose the <b>single answer that best describes what ${isSelf ? "you" : "the learner"} most often do${isSelf ? "" : "es"}</b>, from easiest to most advanced. If it's not often true, choose the "hindi madalas" option; if you haven't had the chance to observe it, choose the "walang pagkakataon" option.</p>
      <p class="sub">You answer <b>one skill at a time</b>, and <b>one item at a time</b>. ${isSelf ? "Each numbered circle turns <b>green</b> once the item is answered." : "At the end of each Life Skill you must write your <b>Feedback to the Learner</b> (the &#9998; circle, up to " + FB_MAX_WORDS + " words) before you can go on to the next Life Skill. Each circle turns <b>green</b> once it is done."} Tap a circle to go back to it.</p>
      ${isDone ? '<div class="notice ok">You already submitted this rating. Submitting again will replace your previous answers.</div>' : ''}
      <div class="actions"><button type="button" class="btn btn-primary" id="help-ok">Got it</button></div></div>`;
    document.body.appendChild(ov);
    const close = ()=>{ ov.remove(); document.removeEventListener("keydown", onK); fitSoon(); };
    const onK = (e)=>{ if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onK);
    ov.addEventListener("click", (e)=>{ if (e.target === ov) close(); });
    ov.querySelector("#help-ok").addEventListener("click", close);
    ov.querySelector("#help-ok").focus();
  }
  document.getElementById("help-btn").addEventListener("click", showHelp);
  const exitBtn = document.getElementById("exit-btn");
  if (exitBtn) exitBtn.addEventListener("click", ()=>{ if (confirm("Leave this form? Answers you have not submitted will be lost.")) { if (exitHome) navTo({}); else navTo({id: exitId}); } });

  function scrollToProgress(){
    try{ document.getElementById("step-progress").scrollIntoView({behavior:"smooth", block:"start"}); }
    catch(e){ window.scrollTo(0,0); }
  }

  /* show one item of the current skill */
  function goItem(qi, scroll){
    const items = steps[current].querySelectorAll(".q-step");
    qi = Math.max(0, Math.min(items.length-1, qi));
    qCur[current] = qi;
    items.forEach((el, idx)=> el.classList.toggle("active", idx===qi));
    const lastItem  = qi === items.length-1;
    const lastSkill = current === total-1;
    document.getElementById("step-back").style.display     = (current===0 && qi===0) ? "none" : "";
    document.getElementById("step-next").style.display     = (lastItem && lastSkill) ? "none" : "";
    document.getElementById("submit-rating").style.display = (lastItem && lastSkill) ? "" : "none";
    document.getElementById("step-next").innerHTML = lastItem
      ? (lastSkill ? "" : "Next skill: " + escapeHtml(SKILLS[SKILL_ORDER[current+1]].label) + " &rarr;")
      : (!isSelf && qi === items.length-2 ? "Next: Feedback to the Learner &rarr;" : "Next item &rarr;");
    paintProgress();
    fitSoon();
    if (scroll !== false) scrollToProgress();
  }

  /* show one skill (its first unanswered item, or item 1 if it is complete) */
  function goStep(i, scroll){
    current = Math.max(0, Math.min(total-1, i));
    steps.forEach((el, idx)=> el.classList.toggle("active", idx===current));
    const m = missingIn(current);
    goItem(m.length ? m[0] : 0, scroll);
  }

  function showMissingModal(count, skillLabel, onGo){
    const old = document.getElementById("missing-overlay");
    if (old) old.remove();
    const ov = document.createElement("div");
    ov.className = "sum-overlay";
    ov.id = "missing-overlay";
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-modal", "true");
    ov.setAttribute("aria-labelledby", "missing-title");
    ov.innerHTML = `
      <div class="sum-modal warn-modal">
        <h3 id="missing-title"><span class="warn-ico">&#9888;</span>${count} item${count===1?"":"s"} still need${count===1?"s":""} to be completed</h3>
        <p class="sub">Before you can continue, please answer every item${isSelf ? "" : " <b>and write the Feedback to the Learner</b>"} for <b>${escapeHtml(skillLabel)}</b>. Tap below and we'll take you straight to ${count===1?"it":"the first one"} — the missing item${count===1?"":"s"} ${count===1?"is":"are"} highlighted in red.</p>
        <div class="actions"><button type="button" class="btn btn-primary" id="missing-ok">Take me there</button></div>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    function close(){
      ov.remove();
      document.body.style.overflow = "";
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e){ if (e.key === "Escape"){ close(); if (onGo) onGo(); } }
    ov.addEventListener("click", (e)=>{ if (e.target === ov){ close(); if (onGo) onGo(); } });
    document.addEventListener("keydown", onKey);
    ov.querySelector("#missing-ok").addEventListener("click", ()=>{ close(); if (onGo) onGo(); });
    const btn = ov.querySelector("#missing-ok");
    if (btn) btn.focus();
  }

  function flagMissing(i){
    const miss = missingIn(i);
    if(!miss.length) return true;
    goStep(i, false);                       // jump to the skill with the gap first
    const items = steps[i].querySelectorAll(".q-step");
    miss.forEach(qi=> items[qi] && items[qi].classList.add("needs-answer"));
    goItem(miss[0], false);                 // and straight to the first unanswered item
    showMissingModal(miss.length, SKILLS[SKILL_ORDER[i]].label, scrollToProgress);
    return false;
  }

  document.getElementById("step-next").addEventListener("click", ()=>{
    const qi   = qCur[current];
    const last = qi === itemCount(current) - 1;
    if (!itemAnswered(current, qi)){
      const it = steps[current].querySelectorAll(".q-step")[qi];
      if (it){
        it.classList.add("needs-answer");
        const ta = it.querySelector("textarea.fb-text");
        if (ta && !ta.value.trim()){ ta.classList.add("fb-missing"); try{ ta.focus({preventScroll:true}); }catch(e){} }
      }
      paintProgress();
      fitSoon();
      return;
    }
    if (!last){ goItem(qi + 1); return; }
    if(!flagMissing(current)) return;       // last item: the whole skill must be complete
    maxDone = Math.max(maxDone, current);
    goStep(current + 1);
  });
  document.getElementById("step-back").addEventListener("click", ()=>{
    if (qCur[current] > 0){ goItem(qCur[current] - 1); return; }
    if (current > 0){ goStep(current - 1, false); goItem(itemCount(current) - 1); }
  });
  /* Feedback is required at the end of every skill, so the rater answers the
     items, then writes the Feedback to the Learner before the next skill. */
  form.addEventListener("change", (e)=>{
    if (e.target && e.target.tagName === "TEXTAREA") return;
    paintProgress();
  });
  form.addEventListener("input", (e)=>{
    if (!e.target || e.target.tagName !== "TEXTAREA") return;
    if (e.target.value.trim()) e.target.classList.remove("fb-missing");
    const item = e.target.closest(".q-step");
    if (item && itemAnswered(current, qCur[current])) item.classList.remove("needs-answer");
    paintProgress();
  });

  /* ---- summary popup shown before the answers are sent ----
     Lists each Life Skill as completed. It deliberately shows NO ratings,
     levels or scores — only the skills that were assessed. */
  function closeSummary(){
    const ov = document.getElementById("sum-overlay");
    if (ov) ov.remove();
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onSumKey);
  }
  function onSumKey(e){ if (e.key === "Escape") closeSummary(); }

  function openSummary(){
    if(!flagMissing(current)) return;
    maxDone = Math.max(maxDone, current);
    for (let i = 0; i < total; i++){
      if (missingIn(i).length){
        goStep(i);
        flagMissing(i);
        return;
      }
    }
    closeSummary();
    let rows = "";
    SKILL_ORDER.forEach((k, i)=>{
      const n = softQuestionsFor(k, role).length;
      rows += `<li>
        <span class="sum-check" aria-hidden="true">&#10003;</span>
        <span class="sum-name">${escapeHtml(SKILLS[k].label)}</span>
        <span class="sum-meta">${n} item${n===1?"":"s"}${isSelf ? " answered" : " + feedback"}</span>
        <button type="button" class="sum-edit" data-goto="${i}">Review</button>
      </li>`;
    });
    const ov = document.createElement("div");
    ov.className = "sum-overlay";
    ov.id = "sum-overlay";
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-modal", "true");
    ov.setAttribute("aria-labelledby", "sum-title");
    ov.innerHTML = `
      <div class="sum-modal">
        <h3 id="sum-title">Review before you submit</h3>
        <p class="sub">You have completed the assessment for these Life Skills${ctx.learnerName ? " for <b>" + escapeHtml(ctx.learnerName) + "</b>" : ""}. Check the list, then submit. Use <b>Review</b> if you want to change any answers first.</p>
        <ul class="sum-list">${rows}</ul>
        <div class="actions">
          <button type="button" class="btn btn-outline" id="sum-back">Go back</button>
          <button type="button" class="btn btn-primary" id="sum-confirm">${isDone ? "Update my rating" : "Confirm &amp; submit"}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onSumKey);

    ov.addEventListener("click", (e)=>{ if (e.target === ov) closeSummary(); });
    ov.querySelector("#sum-back").addEventListener("click", closeSummary);
    ov.querySelectorAll(".sum-edit").forEach(b=>{
      b.addEventListener("click", ()=>{ closeSummary(); goStep(Number(b.dataset.goto)); });
    });
    ov.querySelector("#sum-confirm").addEventListener("click", function(){
      const responses = collectResponses(role);
      if (!responses){ closeSummary(); return; }
      this.disabled = true;
      Promise.resolve(ctx.onSubmit(responses, this)).then(closeSummary, closeSummary);
    });
    const c = ov.querySelector("#sum-confirm");
    if (c) c.focus();
  }

  document.getElementById("submit-rating").addEventListener("click", openSummary);

  // lets collectResponses() send the rater to, and pop up on, a skill they skipped
  window.__surveyFlagMissing = (i)=>{ flagMissing(i); };
  watchSurveyMode();
  goStep(0, false);
  if (!isDone && !window.__surveyHelpSeen){ window.__surveyHelpSeen = true; showHelp(); }
}


/* ---------------------------------------------------------
   FEEDBACK: counter, collection, English summary
   The summary is a keyword-theme analysis of the raters' written comments
   (Filipino or English). It is a draft: on the certificate it is editable
   in the downloadable copy so the teacher can refine the wording.
--------------------------------------------------------- */
const FB_MAX_WORDS = 100;
function fbCount(ta){
  let words = ta.value.trim() ? ta.value.trim().split(/\s+/) : [];
  if (words.length > FB_MAX_WORDS){
    words = words.slice(0, FB_MAX_WORDS);
    ta.value = words.join(" ");
  }
  const c = ta.parentNode.querySelector(".fb-count");
  if (c) c.textContent = words.length + "/" + FB_MAX_WORDS + " words";
}
function collectFeedbackEntries(a){
  const out = [];
  ROLE_ORDER.forEach(role=>{
    const rr = a.raters && a.raters[role];
    if (role === "self" || !rr || rr.status !== "done" || !rr.responses) return;   // feedback comes from teacher / nominated raters only
    SKILL_ORDER.forEach(sk=>{
      const resp = rr.responses[sk];
      if (!resp || typeof resp !== "object") return;
      if (typeof resp.feedback === "string" && resp.feedback.trim()){
        out.push({skillKey:sk, role, qi:null, text:resp.feedback.trim()});
      } else if (Array.isArray(resp.fb)){          // older submissions: per-item feedback
        resp.fb.forEach((t, qi)=>{ if (t && String(t).trim()) out.push({skillKey:sk, role, qi, text:String(t).trim()}); });
      }
    });
  });
  return out;
}
const FB_STRENGTHS = [
  {re:/magaling|mahusay|malinaw|kumpiyansa|confident|articulate|clear|eloquent|maayos magsalita/i, en:"clear and confident communication"},
  {re:/lider|pinuno|namumuno|nanguna|leader|leadership|inspir/i, en:"leadership and initiative"},
  {re:/kooperatib|cooperative|nakikisama|pakikisama|teamwork|nakikipagtulungan|pakikipagtulungan|team ?player/i, en:"cooperation and teamwork"},
  {re:/maparaan|solusyon|diskarte|resourceful|solve|problem|malikhain|creative|matalino|intelligent/i, en:"resourcefulness in solving problems"},
  {re:/matulungin|helpful|supportive|mabait|kind|magalang|respectful|mapagbigay/i, en:"helpfulness and respect toward others"},
  {re:/masipag|sipag|matiyaga|tiyaga|dedicated|hardworking|diligent|persever|determin/i, en:"diligence and perseverance"},
  {re:/maaasahan|responsable|reliable|responsible|mapagkakatiwalaan|dependable/i, en:"reliability and a sense of responsibility"},
  {re:/positibo|positive|masigla|enthusias|eager to learn|willing to learn|mabilis matuto|natututo/i, en:"a positive attitude and willingness to learn"}
];
const FB_GROWTH = [
  {re:/mahiyain|nahihiya|nahihiyang|hiya|shy|takot magsalita|kulang (sa )?(tiwala|kumpiyansa)|lacks? confidence|hesitant|atubili/i, en:"building confidence in speaking up"},
  {re:/pagbutihin|pagbutihan|improve|dagdagan|more practice|magsanay|practice|pagsasanay|training/i, en:"continued practice and training"},
  {re:/makinig|pakikinig|listening|listen/i, en:"active listening"},
  {re:/desisyon|magdesisyon|decision|inisyatiba|initiative|kusa/i, en:"taking initiative and making decisions"},
  {re:/pagsulat|pasulat|writing|grammar|spelling|baybay|balarila/i, en:"written communication"},
  {re:/oras|time management|late|huli|punctual/i, en:"time management"}
];
function fbJoin(arr){
  if (arr.length <= 1) return arr.join("");
  return arr.slice(0, -1).join(", ") + " and " + arr[arr.length-1];
}
/** Thematic analysis of ALL Life Skills taken as ONE whole.
    Every Feedback to the Learner (all four skills, all raters) is pooled into a
    single corpus. A theme is ranked by how many different raters raise it and
    how many different Life Skills it appears in, not by any one skill alone, so
    the result describes the learner overall. */
function feedbackThemes(a){
  const ents = collectFeedbackEntries(a);
  const tally = (list)=>{
    const m = {};
    ents.forEach(e=>{
      list.forEach((t,i)=>{
        if (!t.re.test(e.text)) return;
        const o = m[i] || (m[i] = {i, hits:0, raters:new Set(), skills:new Set()});
        o.hits++; o.raters.add(e.role); o.skills.add(e.skillKey);
      });
    });
    return Object.values(m).sort((x,y)=> (y.skills.size - x.skills.size) || (y.raters.size - x.raters.size) || (y.hits - x.hits));
  };
  return {
    ents,
    raters: new Set(ents.map(e=>e.role)).size,
    skills: new Set(ents.map(e=>e.skillKey)),
    strengths: tally(FB_STRENGTHS).slice(0,3).map(o=>Object.assign({en:FB_STRENGTHS[o.i].en}, o)),
    growth: tally(FB_GROWTH).slice(0,3).map(o=>Object.assign({en:FB_GROWTH[o.i].en}, o))
  };
}
function feedbackSummaryText(a){
  const T = feedbackThemes(a);
  if (!T.ents.length) return "No written feedback (Feedback to the Learner) was provided by the raters.";
  const n = T.ents.length, r = T.raters, ns = T.skills.size;
  const spread = (o)=> o.skills.size > 1 ? " (across " + o.skills.size + " Life Skills)" : "";
  let t = "Taken as a whole across all Life Skills, " + n + " written feedback entr" + (n===1?"y":"ies") + " from " + r + " rater" + (r===1?"":"s") + " covering " + ns + " of " + SKILL_ORDER.length + " Life Skills " + (n===1?"was":"were") + " analysed together. ";
  if (T.strengths.length) t += "Overall, raters commend the learner’s " + fbJoin(T.strengths.map(o=>o.en + spread(o))) + ". ";
  else t += "No single strength theme stood out overall. ";
  if (T.growth.length) t += "Overall suggested areas for growth: " + fbJoin(T.growth.map(o=>o.en + spread(o))) + ".";
  else t += "No specific areas for growth were identified in the feedback.";
  return t;
}
function feedbackSummaryHtml(a, editable){
  return `<div class="fb-summary"${editable ? ' contenteditable="true"' : ''}><b>Summary of Rater Feedback (all Life Skills):</b> ${escapeHtml(feedbackSummaryText(a))}</div>`;
}
function feedbackReviewCard(a){
  const ents = collectFeedbackEntries(a);
  if (!ents.length) return "";
  let rows = "";
  ents.forEach(e=>{
    const q = e.qi===null ? null : softQuestionsFor(e.skillKey, e.role)[e.qi];
    rows += `<div class="soft-item"><p class="soft-item-title">${escapeHtml(SKILLS[e.skillKey].label)} &middot; ${e.qi===null ? "Feedback to the Learner" : "item " + (e.qi+1) + (q ? " &mdash; " + escapeHtml(q.title) : "")} <span class="tag">${escapeHtml(ROLES[e.role].short)}</span></p><p class="soft-item-prompt">${escapeHtml(e.text)}</p></div>`;
  });
  return `<div class="card no-print"><details><summary style="cursor:pointer;font-family:var(--serif);color:var(--maroon-dark);font-size:1.1rem;">Rater feedback (${ents.length})</summary>
    <p class="sub" style="margin-top:10px;"><b>Certificate summary:</b> ${escapeHtml(feedbackSummaryText(a))}</p>${rows}</details></div>`;
}

/** Read the full item-bank form, score each competency, or warn and return
    null if any item is still unanswered. */
function collectResponses(role){
  const form = document.getElementById("rater-form");
  const responses = {};
  const missing = [];
  let firstMissingIdx = -1;
  SKILL_ORDER.forEach((skillKey, ski)=>{
    const questions = softQuestionsFor(skillKey, role);
    const unanswered = questions.some((q, qi)=> !form.querySelector(`input[name="${skillKey}__q${qi}"]:checked`));
    if (unanswered){ missing.push(SKILLS[skillKey].label); if (firstMissingIdx < 0) firstMissingIdx = ski; return; }
    // Record this rater's raw, item-by-item category choice (0-based rank
    // among that item's scoreable options; null for an N/A / "no chance to
    // observe" pick). computeResults() pools these across raters through
    // the MFRM model below instead of averaging a single number here.
    const k = questions.map((q, qi)=>{
      const sel = form.querySelector(`input[name="${skillKey}__q${qi}"]:checked`);
      const oi = Number(sel.value);
      if (isSoftNAOption(q.options[oi])) return null;
      const realIdx = [];
      q.options.forEach((o,i)=>{ if(!isSoftNAOption(o)) realIdx.push(i); });
      return realIdx.indexOf(oi);
    });
    const fta = form.querySelector(`textarea[name="${skillKey}__fbfinal"]`);
    const feedback = (fta ? fta.value.trim().split(/\s+/).filter(Boolean) : []).slice(0, FB_MAX_WORDS).join(" ");
    if (role !== "self" && !feedback){ missing.push(SKILLS[skillKey].label); if (firstMissingIdx < 0) firstMissingIdx = ski; return; }
    // `feedback` = the one Feedback to the Learner for this skill; `fb` mirrors it
    // as a one-element list so the existing backend shape is unchanged.
    responses[skillKey] = { k, feedback, fb: [feedback] };
  });
  if(missing.length){
    if (firstMissingIdx >= 0 && typeof window.__surveyFlagMissing === "function"){
      window.__surveyFlagMissing(firstMissingIdx);
    } else {
      alert("Please answer every item for: " + missing.join(", "));
    }
    return null;
  }
  return responses;
}

/* ---------- RATER: arrives with their own unique code ---------- */
async function renderRaterByCode(code){
  const clean = String(code||"").trim().toUpperCase();
  app.innerHTML = `<div class="card"><p class="sub">Opening your survey form&hellip;</p></div>`;
  flushPendingRaterSubmissions(); // in case an earlier attempt from this device is still queued

  if (!hasApi()){
    app.innerHTML = `
      <div class="card">
        <h2>This copy isn't connected yet</h2>
        <p class="sub">Your code is fine — but this copy of the file doesn't know which division database to check it against.</p>
        <p class="sub"><b>Ask your teacher for either:</b></p>
        <ul class="sub" style="line-height:1.7;">
          <li>your <b>rating link</b> — it carries the address and opens your form straight away, or</li>
          <li>the <b>ready-to-share copy</b> of this file, in which the address is already filled in. Codes then work on any device.</li>
        </ul>
        <div class="actions"><a class="btn btn-outline" href="#">Back</a></div>
      </div>`;
    return;
  }

  let r;
  try{ r = await api("raterGet", {code: clean}); }
  catch(e){
    app.innerHTML = `
      <div class="card">
        <h2>Can't connect</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <p class="sub">Check this device's internet connection and try again. Your code is <b>${escapeHtml(formatCode(clean))}</b>.</p>
        <div class="actions"><button class="btn btn-primary" onclick="renderRaterByCode('${escapeHtml(clean)}')">Try again</button></div>
      </div>`;
    return;
  }

  if (!r || !r.ok){
    // Distinguish "the code is wrong" from "the database is running old code",
    // because the fix is completely different and the wrong message sends the
    // teacher hunting for a typo that isn't there.
    const err  = (r && r.error) || "";
    const stale = err === "UNKNOWN_ACTION" || err === "BAD_SECRET" ||
                  /unknown action|access phrase/i.test((r && r.message) || "");
    app.innerHTML = stale
      ? `<div class="card">
           <h2>The database needs updating</h2>
           <p class="sub">Your code is probably fine. The Google Apps Script behind this tool is still running an older version that doesn't know about rater codes yet.</p>
           <p class="sub"><b>Please show your teacher or coordinator this message.</b> They need to:</p>
           <ol class="sub" style="line-height:1.7;">
             <li>Open the division Google Sheet ▸ <b>Extensions ▸ Apps Script</b></li>
             <li>Replace all the code with the current <code>ALS_Backend_AppsScript.gs</code> and save</li>
             <li>Run <b>setupSheets</b> once</li>
             <li><b>Deploy ▸ Manage deployments ▸ ✏️ ▸ Version: New version ▸ Deploy</b><br>
                 <span class="tag">This last step is the one people miss — Apps Script keeps serving the old version until a new one is deployed.</span></li>
           </ol>
           <div class="actions"><button class="btn btn-outline" onclick="renderRaterByCode('${escapeHtml(clean)}')">Try again</button></div>
         </div>`
      : `<div class="card">
           <h2>Code not recognised</h2>
           <p class="sub">${escapeHtml((r && r.message) || "That code wasn't recognised.")}</p>
           <p class="sub">You entered <b>${escapeHtml(formatCode(clean))}</b>. Rater codes are 8 characters like <code>ABCD-1234</code>, and each rater has a different one for each learner.</p>
           <p class="sub">They never contain the digits <b>0</b> or <b>1</b>, or the letters <b>O</b>, <b>I</b> or <b>L</b> — if you read one of those, it is a zero-lookalike. Try <b>0</b>→<b>O</b>, <b>1</b>→<b>7</b>, <b>I</b>/<b>L</b>→<b>J</b>.</p>
           <div class="actions"><a class="btn btn-outline" href="#">Try another code</a></div>
         </div>`;
    return;
  }

  const who = params.get("who");
  if ((who === "learner" && r.role !== "self") || (who === "rater" && r.role === "self")){
    const right = r.role === "self" ? "learner" : "rater";
    const rightName = right === "learner" ? "Self-Assessment (Learner)" : "Rater (Nominated Rater)";
    const thisName  = who === "learner" ? "Self-Assessment (Learner)" : "Rater (Nominated Rater)";
    app.innerHTML = `
      <div class="card">
        <h2>That code belongs on a different tab</h2>
        <p class="sub">Your code is fine, but it is for <b>${escapeHtml(r.roleLabel || rightName)}</b>, not for the <b>${thisName}</b> tab.</p>
        <p class="sub">Use the <b>${rightName}</b> tab and enter the same code there.</p>
        <div class="actions">
          <button class="btn btn-primary" onclick="landingTab='${right}';navTo({r:'',who:''})">Go to the ${rightName} tab</button>
        </div>
      </div>`;
    return;
  }

  renderSurvey({
    role: r.role,
    roleLabel: r.roleLabel,
    learnerName: r.learnerName,
    school: r.school,
    photoUri: r.photoUri || "",
    existing: r.responses || {},

  });
}

let _raterAutoRetryTimer = null;
function stopRaterAutoRetry(){
  if (_raterAutoRetryTimer){ clearTimeout(_raterAutoRetryTimer); _raterAutoRetryTimer = null; }
}
/** Keeps trying raterSubmit in the background — with a growing wait between
    tries — so a dropped connection resolves itself the moment the network
    comes back, with no copy-paste step required from the rater. The answers
    are already queued in this device's storage (queuePendingRaterSubmission),
    so even closing the tab and coming back later still gets them sent. */
function startRaterAutoRetry(code, responses, info){
  stopRaterAutoRetry();
  let tries = 0;
  const tick = async () => {
    tries++;
    try{
      const r = await api("raterSubmit", {code, responses});
      if (r && r.ok){
        stopRaterAutoRetry();
        clearPendingRaterSubmission(code);
        showRaterSubmitSuccess(info);
        return;
      }
    }catch(e){ /* still failing — keep the queue and try again */ }
    const st = document.getElementById("retry-status");
    if (st) st.textContent = "Still trying to send&hellip; (attempt " + (tries + 1) + ")";
    _raterAutoRetryTimer = setTimeout(tick, Math.min(30000, 5000 * tries));
  };
  _raterAutoRetryTimer = setTimeout(tick, 5000);
}

async function submitByCode(code, responses, info, btn){
  if (btn){ btn.disabled = true; btn.textContent = "Sending…"; }
  // Queue first, before any network attempt — this is the record of what the
  // rater actually answered, and it survives a dropped connection, a closed
  // tab, or the network call below failing outright.
  queuePendingRaterSubmission(code, info.role, responses);
  let serverErr = "";
  try{
    const r = await apiWithRetry("raterSubmit", {code, responses}, 3);
    if (r && r.ok){
      clearPendingRaterSubmission(code);
      showRaterSubmitSuccess(info);
      return;
    }
    serverErr = (r && r.error) || "";
    throw new Error((r && r.message) || "The database refused the submission.");
  }catch(e){
    // The server actually answered, but doesn't recognize this action — no
    // amount of retrying fixes that; it needs a fresh Apps Script deployment.
    // Distinguishing this from a dropped connection matters because the fix
    // is completely different, same as the equivalent check on raterGet.
    const stale = serverErr === "UNKNOWN_ACTION" || /unknown action/i.test(e.message || "");
    if (stale){
      app.innerHTML = `
        <div class="card">
          <h2>The database needs updating</h2>
          <p class="sub">Your answers were entered correctly and are saved on this device — but the Google Apps Script behind this tool doesn't yet recognize how to file a submitted rating (the "raterSubmit" action isn't there). This is a setup issue on the backend, not a mistake in anything you answered.</p>
          <p class="sub"><b>Please show your teacher or coordinator this message.</b> They need to:</p>
          <ol class="sub" style="line-height:1.7;">
            <li>Open the division Google Sheet ▸ <b>Extensions ▸ Apps Script</b></li>
            <li>Replace all the code with the current <code>ALS_Backend_AppsScript.gs</code> and save</li>
            <li>Run <b>setupSheets</b> once</li>
            <li><b>Deploy ▸ Manage deployments ▸ ✏️ ▸ Version: New version ▸ Deploy</b><br>
                <span class="tag">This last step is the one people miss — Apps Script keeps serving the old version until a new one is deployed.</span></li>
          </ol>
          <div class="actions"><button class="btn btn-outline" id="retry-now-btn">Try again</button></div>
        </div>`;
      const retryBtn = document.getElementById("retry-now-btn");
      if (retryBtn) retryBtn.addEventListener("click", () => submitByCode(code, responses, info, btn));
      if (btn){ btn.disabled = false; btn.textContent = "Submit rating"; }
      return; // retrying automatically can't fix a missing backend action
    }
    // Still queued on this device (see above) and being retried automatically
    // below; the portable code is a manual backup, not the only way it's sent.
    const payload = encodeSubmission(code, info.role, responses);
    app.innerHTML = `
      <div class="card">
        <h2>Couldn't send it just now</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <p class="sub">Your answers are saved on this device and this page will keep trying to send them automatically — you don't need to do anything. If you'd rather not wait, copy the code below and send it to your teacher as a backup, or reconnect and open your link again.</p>
        <p class="sub" id="retry-status">Retrying automatically&hellip;</p>
        <div class="codebox" id="code-out">${payload}</div>
        <div class="actions">
          <button class="btn btn-primary" onclick="copyCode()">Copy code</button>
          <button class="btn btn-outline" id="retry-now-btn">Retry now</button>
        </div>
      </div>`;
    window._pendingCode = payload;
    const retryBtn = document.getElementById("retry-now-btn");
    if (retryBtn) retryBtn.addEventListener("click", () => submitByCode(code, responses, info, btn));
    startRaterAutoRetry(code, responses, info);
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = "Submit rating"; }
  }
}

/** Pretty-print a rater code as XXXX-XXXX. */
function formatCode(c){
  const t = String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  return t.length === 8 ? t.slice(0,4) + "-" + t.slice(4) : t;
}

/* navigator.clipboard is unavailable on a page opened from a file (it needs a
   "secure context"), which is exactly how most teachers will open this on a
   phone. Fall back to the old execCommand trick, and finally to a prompt the
   user can copy from by hand. */
async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text); return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) return true;
  }catch(e){}
  window.prompt("Copy this by holding down on the text, then choose Copy:", text);
  return false;
}

/* Paste straight into a field — a real help on a phone, where selecting a long
   URL by hand is painful. */
async function pasteInto(inputId, btn){
  try{
    if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("unsupported");
    const t = await navigator.clipboard.readText();
    if (!t) throw new Error("empty");
    document.getElementById(inputId).value = t.trim();
    if (btn){ const o = btn.textContent; btn.textContent = "Pasted"; setTimeout(()=>btn.textContent = o, 1200); }
  }catch(e){
    const el = document.getElementById(inputId);
    el.focus();
    alert("Your browser won't let the page read the clipboard. Tap and hold inside the box, then choose Paste.");
  }
}

async function copyLink(link, btn){

/* ---------- CERTIFICATE ---------- */
function computeResults(a){
  const results = {};
  SKILL_ORDER.forEach(skillKey=>{
    const design = buildMFRMDesign(a, skillKey);
    if(design.length === 0){
      const lvDef = SKILLS[skillKey].levels.find(l=>l.n===1);
      results[skillKey] = {level:1, title:lvDef.title, ratersCounted:0, mfrm:null};
      return;
    }
    const fit = fitMFRM(design);
    const { level } = mfrmLevelForSkill(fit, skillKey);
    const lvDef = SKILLS[skillKey].levels.find(l=>l.n===level);
    results[skillKey] = {
      level, title: lvDef.title, ratersCounted: fit.raters.length,
      mfrm: { theta: fit.theta, se: fit.se, n: fit.n, raters: fit.alpha, items: fit.items }
    };
  });
  return results;
}

/** Small technical readout for the coordinator/teacher: person measure,
    rater spread and item spread per skill, from the same MFRM fit
    computeResults() used for the certificate levels. Never shown on the
    certificate itself. */
function mfrmReportHtml(a){
  const results = computeResults(a);
  let rows = "";
  SKILL_ORDER.forEach(skillKey=>{
    const r = results[skillKey];
    if(!r.mfrm){
      rows += `<div class="soft-item"><p class="soft-item-title">${escapeHtml(SKILLS[skillKey].label)}</p>
        <p class="soft-item-prompt">No ratings yet.</p></div>`;
      return;
    }
    const m = r.mfrm;
    const raterVals = ROLE_ORDER.filter(role=>m.raters[role]).map(role=>({role, ...m.raters[role]}));
    const spread = raterVals.length>1
      ? Math.max(...raterVals.map(x=>x.severity)) - Math.min(...raterVals.map(x=>x.severity))
      : 0;
    const raterLine = raterVals.length
      ? raterVals.map(x=> `${escapeHtml(ROLES[x.role].short)} ${x.severity>=0?"+":""}${x.severity.toFixed(2)}`).join(" &nbsp;·&nbsp; ")
      : "—";
    rows += `<div class="soft-item">
      <p class="soft-item-title">${escapeHtml(SKILLS[skillKey].label)} <span class="tag">Level ${r.level}</span></p>
      <p class="soft-item-prompt">
        Person measure: <b>${m.theta>=0?"+":""}${m.theta.toFixed(2)} logits</b> (SE ${m.se.toFixed(2)}) · based on ${m.n} item responses from ${r.ratersCounted} rater${r.ratersCounted===1?"":"s"}.<br>
        Rater severity (higher = stricter, centred at 0): ${raterLine}${raterVals.length>1 ? ` &nbsp;·&nbsp; spread ${spread.toFixed(2)} logits` : ""}
      </p>
    </div>`;
  });
  return `<div style="margin-top:6px;">${rows}</div>`;
}

/* Auto-generated verification QR code. Encodes the certificate's
   identifying details as plain text so any QR scanner can read it
   without needing a live server. */
function buildQrUrl(a, results, dateIssued){
  const lines = [
    "ALS MICRO-CERTIFICATE IN LIFE SKILLS",
    "Learner: " + (a.learnerName||""),
    "Certificate No.: " + (a.certNumber||""),
    "ALS CLC/School: " + (a.school||"—"),
    "Schools Division Office: " + (a.sdo||"—"),
    "Date Issued: " + dateIssued
  ];
  SKILL_ORDER.forEach(k=>{
    lines.push(SKILLS[k].label + ": Level " + results[k].level + " — " + results[k].title);
  });
  const data = encodeURIComponent(lines.join("\n"));
  // 600px for a 28mm print, i.e. about 545 dpi — stays sharp on paper.
  return "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=8&ecc=M&data=" + data;
}

/* Re-encode an uploaded logo at a sensible print resolution (600px on the long
   edge ≈ 5x the printed size, so it stays crisp on paper) while keeping the
   stored data small enough to sync quickly. */
function normaliseLogo(file, maxEdge){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("Couldn't read that image."));
    reader.onload = (e)=>{
      const raw = e.target.result;
      const img = new Image();
      img.onerror = ()=> resolve(raw);   // not a bitmap (e.g. SVG) — keep as-is
      img.onload = ()=>{
        try{
          const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
          if (scale >= 1 && raw.length < 300000) return resolve(raw);
          const c = document.createElement("canvas");
          c.width  = Math.max(1, Math.round(img.width  * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/png"));
        }catch(err){ resolve(raw); }
      };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  });
}

async function loadPreviewSlot(input, id, field, key){
  const file = input.files[0]; if(!file) return;
  let dataUri;
  try{ dataUri = await normaliseLogo(file, field === "photoUri" ? 700 : 600); }
  catch(e){ alert(e.message); return; }
  const img = document.getElementById(key + "-img-top") || document.getElementById(key + "-img");
  const ph  = document.getElementById(key + "-ph-top");
  if (img) { img.src = dataUri; img.style.display = "block"; }
  if (ph) ph.style.display = "none";
  const box = document.getElementById(key === "photo" ? "photo-box-top" : "");
  if (box) box.classList.add("has-img");
  if (key === "photo"){ setPhotoLayout(true); const rm = document.getElementById("photo-remove-top"); if (rm) rm.style.display = ""; }
  if (key === "logo-partner"){ const slot = img && img.closest(".logo-slot"); if (slot) slot.classList.add("has-img"); }
  const a = await loadAssessment(id);
  if(a){ a[field] = dataUri; await saveAssessment(a); }
  if (typeof fitStage === "function") setTimeout(fitStage, 60);
}

  const file = input.files[0]; if(!file) return;

async function downloadEditableCertificate(id){
  const a = await loadAssessment(id);
  if(!a){ alert("Couldn't load this assessment."); return; }
  const blob = new Blob([buildCertificateDoc(a)], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = certificateFileName(a, "html");
  link.click();
  URL.revokeObjectURL(url);
}

  const apiOnly = params.get("api");

  const raw = params.get("setup");
  if (raw){

/* ==========================================================
   ONEDRIVE  (Microsoft Graph via MSAL)
   ========================================================== */
const MSAL_SRC = "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js";
let _msalApp = null;

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const el = document.createElement("script");
    el.src = src; el.async = true;
    el.onload = resolve;
    el.onerror = ()=> reject(new Error("Couldn't load the Microsoft sign-in library. Check this device's internet connection."));
    document.head.appendChild(el);
  });
}

async function getGraphToken(){
  const cfg = getConfig();
  if(!cfg.msClientId) throw new Error("No Microsoft Application (client) ID has been set. Add it under Settings ▸ OneDrive storage.");
  if(location.protocol === "file:") throw new Error("Microsoft sign-in needs this page served over http:// or https://. Publish the HTML (GitHub Pages, your division site, or SharePoint) and open it from there.");
  if(!window.msal) await loadScript(MSAL_SRC);
  if(!_msalApp){
    _msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: cfg.msClientId,
        authority: "https://login.microsoftonline.com/" + (cfg.msTenant || "common"),
        redirectUri: location.origin + location.pathname
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    });
    if (typeof _msalApp.initialize === "function") await _msalApp.initialize();
    try { await _msalApp.handleRedirectPromise(); } catch(e){}
  }
  const scopes = ["Files.ReadWrite", "User.Read"];
  let account = (_msalApp.getAllAccounts() || [])[0];
  if(!account){
    const r = await _msalApp.loginPopup({ scopes, prompt: "select_account" });
    account = r.account;
  }
  try{
    const r = await _msalApp.acquireTokenSilent({ scopes, account });
    return r.accessToken;
  }catch(e){
    const r = await _msalApp.acquireTokenPopup({ scopes, account });
    return r.accessToken;
  }
}

async function graph(token, path, opts){
  const res = await fetch("https://graph.microsoft.com/v1.0" + path,
    Object.assign({ headers: Object.assign({ Authorization: "Bearer " + token }, (opts&&opts.headers)||{}) }, opts||{}));
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return data;
}

async function ensureOneDriveFolder(token, name){
  try{
    return await graph(token, "/me/drive/root:/" + encodeURIComponent(name) + ":", {method:"GET"});
  }catch(e){
    if(e.status !== 404) throw e;
    return await graph(token, "/me/drive/root/children", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name: name, folder: {}, "@microsoft.graph.conflictBehavior": "replace" })
    });
  }
}

function certificateFileName(a, ext){
  const safe = (a.learnerName || "Learner").replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_");
  return `ALS-Micro-Certificate_${a.certNumber || a.id}_${safe}.${ext}`;
}

async function saveCertificateToOneDrive(id, btn){
  const box = document.getElementById("od-cert-result");
  const say = (cls, msg) => { if(box) box.innerHTML = `<div class="notice ${cls}">${msg}</div>`; else if(cls==="err") alert(msg); };
  if(btn){ btn.disabled = true; btn.dataset.old = btn.textContent; btn.textContent = "Saving to OneDrive…"; }
  try{
    const a = await loadAssessment(id);
    if(!a) throw new Error("Couldn't load this assessment.");
    const cfg    = getConfig();
    const folder = (cfg.oneDriveFolder || "ALS Micro-Certificates").replace(/^\/+|\/+$/g, "");
    const html   = buildCertificateDoc(a);
    const name   = certificateFileName(a, "html");

    say("", "Signing in to Microsoft&hellip;");
    const token = await getGraphToken();
    say("", "Preparing the OneDrive folder&hellip;");
    await ensureOneDriveFolder(token, folder);
    say("", "Uploading the certificate&hellip;");
    const item = await graph(token,
      "/me/drive/root:/" + encodeURIComponent(folder) + "/" + encodeURIComponent(name) + ":/content",
      { method: "PUT", headers: {"Content-Type": "text/html"}, body: html });

    const link = item && item.webUrl ? item.webUrl : "";
    if (hasApi()){
      try{ await api("markIssued", {id: a.id, location: link || (folder + "/" + name)}); }catch(e){}
    }
    say("ok", `Saved to OneDrive as <b>${escapeHtml(folder)}/${escapeHtml(name)}</b>.` +
      (link ? ` <a href="${link}" target="_blank" rel="noopener">Open it in OneDrive</a>.` : "") +
      ` Open the file and use <b>Print ▸ Save as PDF</b> for the printable copy.`);
  }catch(e){
    say("err", `OneDrive save failed: ${escapeHtml(e.message)}`);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.old || "Save to OneDrive"; }
  }
}

/* ==========================================================
   PREVIEW SCALING  (screen only — never touches the paper)

   The certificate is built at its real paper size, 277 x 190mm. To show it
   inside a browser window that may be narrower than that, .sheet-scaler gets
   a CSS transform. A transform re-photographs the page; it does not re-lay it
   out. Nothing moves, nothing re-wraps, no font changes size relative to
   anything else — the preview is the printed page, just viewed smaller.

   At print time the transform is removed by the @media print rules, so the
   fixed millimetre canvas lands on the sheet 1:1. There is no shrink-to-fit
   and no browser scaling involved, which is why the output is identical
   across browsers, operating systems, printers and PDF viewers.

   Self-contained (no references outside themselves) because these functions
   are also serialised into the downloadable certificate file.
   ========================================================== */

/** Scale each page down to the available width. Never scales up past 1:1. */
function fitStage(){
  var stages = document.querySelectorAll(".sheet-stage");
  for (var i = 0; i < stages.length; i++){
    var stage  = stages[i];
    var scaler = stage.querySelector(".sheet-scaler");
    if (!scaler) continue;
    var page = scaler.firstElementChild;
    if (!page) continue;

    scaler.style.transform = "none";
    stage.style.height = "";

    var natural = page.getBoundingClientRect();
    var avail   = stage.clientWidth;
    if (!natural.width || !avail) continue;

    var k = Math.min(1, avail / natural.width);
    if (k < 1){
      scaler.style.transform = "scale(" + k + ")";
      // A transform doesn't shrink the space the element reserves, so give
      // the stage the scaled height explicitly or a gap opens underneath.
      stage.style.height = Math.ceil(natural.height * k) + "px";
    }
  }
}

/** Re-fit on resize and rotate, but not more often than a frame. */
function hookPrint(){
  if (window.__alsPrintHooked) return;
  window.__alsPrintHooked = true;

  var pending = false;
  var onResize = function(){
    if (pending) return;
    pending = true;
    window.requestAnimationFrame(function(){ pending = false; fitStage(); });
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  window.addEventListener("load", fitStage);

  // Belt and braces: drop the preview transform for the duration of a print,
  // in case a browser evaluates layout before applying the print stylesheet.
  var unscale = function(){
    var sc = document.querySelectorAll(".sheet-scaler");
    for (var i = 0; i < sc.length; i++) sc[i].style.transform = "none";
    var st = document.querySelectorAll(".sheet-stage");
    for (var j = 0; j < st.length; j++) st[j].style.height = "";
  };
  window.addEventListener("beforeprint", unscale);
  window.addEventListener("afterprint", fitStage);
  if (window.matchMedia){
    var mq = window.matchMedia("print");
    var onChange = function(e){ if (e.matches) unscale(); else fitStage(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
}

/** Print button: make sure the logos and QR have arrived, then hand over. */
function printSheets(){
  var imgs = Array.prototype.slice.call(document.querySelectorAll(".certificate img,.backpage img"));
  var waiting = imgs.filter(function(im){ return !im.complete || !im.naturalWidth; });
  var done = false;
  var go = function(){
    if (done) return;
    done = true;
    var sc = document.querySelectorAll(".sheet-scaler");
    for (var i = 0; i < sc.length; i++) sc[i].style.transform = "none";
    var st = document.querySelectorAll(".sheet-stage");
    for (var j = 0; j < st.length; j++) st[j].style.height = "";
    window.print();
    setTimeout(fitStage, 300);
  };
  if (!waiting.length){ go(); return; }
  var left = waiting.length;
  waiting.forEach(function(im){
    var tick = function(){ if (--left <= 0) go(); };
    im.addEventListener("load", tick, {once:true});
    im.addEventListener("error", tick, {once:true});
  });
  setTimeout(go, 2000);
}

/** Serialise the above into the standalone downloadable certificate. */
function printSupportSource(){
  return [fitStage, hookPrint, printSheets]
    .map(function(f){ return f.toString(); }).join("\n") +
    "\nhookPrint();fitStage();window.addEventListener('load',fitStage);";
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showBuild(){
  const el = document.getElementById("buildstamp");
  if (el) el.textContent = BUILD;
}

function setupLetterheadLogos(){
  document.querySelectorAll('img[data-logo="als"]').forEach(img=>img.src=ALS_LOGO_URI);
  document.querySelectorAll('img[data-logo="deped"]').forEach(img=>img.src=DEPED_LOGO_URI);
}
setupLetterheadLogos();
showBuild();
render();
</script>
